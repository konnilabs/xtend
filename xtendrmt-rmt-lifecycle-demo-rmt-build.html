<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="xtend-preload" content="xstate,x-theme,x-rmt-lifecycle-demo-build">
  <title>XTend RMT App Build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div
    id="rmt-build-root"
    data-rmt-build-root
    data-rmt-template-src="xtendrmt/rmt-lifecycle-demo.rmt"
    data-rmt-core-src="xtendrmt/rmt-lifecycle-demo.rmt-build.core.json"
    data-scaffold-build="node xtend-builder/scaffold.js rmt-build --source xtendrmt/rmt-lifecycle-demo.rmt --write --json"
    aria-busy="true"></div>
  <script type="module" src="xtend-loader.js" data-manifest="components/manifest.json"></script>
  <script type="module">
    window.__XTendRmtBuildBootPromise = (window.__XTendLoaderBootPromise || Promise.resolve())
      .then(() => import('./xtendrmt/rmt-lifecycle-demo.rmt-build.app.js'))
      .then((module) => module.bootRmtBuildApp())
      .catch((error) => {
        window.__XTendRmtBuildResult = {
          status: 'failed',
          schema: 'xtend.scaffold.rmt-app-build.v1',
          error: error.message
        };
        console.error('XTend RMT app build failed', error);
      });
  </script>
</body>
</html>
