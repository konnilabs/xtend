<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">RMT stack topography</title>
  <desc id="desc">A layered view from RMT source and compiler through the RMT kernel, Fabric, host adapters and UI frameworks.</desc>
  <defs>
    <linearGradient id="kernel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="ui" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .card { filter: url(#shadow); stroke: rgba(15, 23, 42, 0.16); stroke-width: 1.5; }
      .label { fill: #f8fafc; font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .copy { fill: #e2e8f0; font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .dark { fill: #0f172a; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #475569; font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .pillText { fill: #1e293b; font: 650 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .softLine { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1120" height="640" rx="28"/>

  <rect class="pill" x="56" y="52" width="214" height="64" rx="14"/>
  <text class="dark" x="82" y="85">RMT source</text>
  <text class="muted" x="82" y="106">.rmt documents</text>

  <rect class="pill" x="330" y="52" width="214" height="64" rx="14"/>
  <text class="dark" x="356" y="85">Compiler</text>
  <text class="muted" x="356" y="106">core records</text>

  <path class="line" d="M270 84 H320"/>

  <rect class="card" x="80" y="168" width="960" height="98" rx="20" fill="url(#kernel)"/>
  <text class="label" x="116" y="210">RMT Kernel</text>
  <text class="copy" x="116" y="237">State, selectors, actions, events, resources, surfaces, scheduler and diagnostics.</text>

  <rect class="card" x="80" y="310" width="960" height="98" rx="20" fill="url(#fabric)"/>
  <text class="label" x="116" y="352">XTend Fabric</text>
  <text class="copy" x="116" y="379">Lanes, fibers, hydration policies, backpressure, telemetry and completion signals.</text>

  <rect class="card" x="80" y="452" width="960" height="98" rx="20" fill="url(#ui)"/>
  <text class="label" x="116" y="494">UI and host layer</text>
  <text class="copy" x="116" y="521">XTend UI Web Components, SurfaceManager, DOM descriptors, React, Vue and VanillaJS adapters.</text>

  <path class="line" d="M437 116 V154"/>
  <path class="line" d="M560 266 V296"/>
  <path class="line" d="M560 408 V438"/>
  <path class="softLine" d="M1040 501 C1085 501 1085 215 1040 215"/>
  <text class="muted" x="844" y="599">Host adapters keep framework details outside the kernel.</text>
</svg>
