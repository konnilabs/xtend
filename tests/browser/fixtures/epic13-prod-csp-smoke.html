<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'nonce-xtend-e13-prod-csp-smoke'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'">
  <meta name="xtend-preload" content="xstate,x-theme,x-router,x-link,x-alert,x-toast">
  <title>XTend Epic 13 PROD CSP Smoke</title>
</head>
<body data-xtend-fixture="epic13-prod-csp-smoke">
  <main id="epic13-prod-csp-root" data-contract="xtend.epic13.prod-browser-csp-smoke-fixture.v1">
    <x-alert id="prod-csp-alert" type="info" aria-label="PROD CSP smoke alert">PROD CSP smoke ready.</x-alert>
    <x-router id="prod-csp-router" mode="hash">
      <x-route path="/" component="xtend-prod-csp-home" title="PROD CSP Home"></x-route>
      <x-route path="/detail" component="xtend-prod-csp-detail" title="PROD CSP Detail"></x-route>
    </x-router>
  </main>

  <script type="module" nonce="xtend-e13-prod-csp-smoke" src="/xtend-loader.js" data-manifest="/tests/browser/fixtures/components/manifest.json" data-module-cache-bust="epic13-prod-csp-smoke" data-prod-csp-smoke="WP-E13-07"></script>
  <script type="module" nonce="xtend-e13-prod-csp-smoke">
    class XTendProdCspHome extends HTMLElement {
      connectedCallback() {
        const section = document.createElement('section');
        section.setAttribute('data-route', 'home');
        section.textContent = 'PROD CSP home route rendered.';
        this.replaceChildren(section);
      }
    }

    class XTendProdCspDetail extends HTMLElement {
      connectedCallback() {
        const section = document.createElement('section');
        section.setAttribute('data-route', 'detail');
        section.textContent = 'PROD CSP detail route rendered.';
        this.replaceChildren(section);
      }
    }

    customElements.define('xtend-prod-csp-home', XTendProdCspHome);
    customElements.define('xtend-prod-csp-detail', XTendProdCspDetail);

    window.__xtendEpic13ProdCspSmokeResult = {
      schema: 'xtend.epic13.prod-browser-csp-smoke-fixture.v1',
      status: 'pending',
      checks: [],
      errors: []
    };

    function recordCheck(name, ok, detail) {
      window.__xtendEpic13ProdCspSmokeResult.checks.push({ name, ok, detail: detail || null });
      if (!ok) {
        window.__xtendEpic13ProdCspSmokeResult.errors.push(name);
      }
    }

    function complete(status) {
      window.__xtendEpic13ProdCspSmokeResult.status = status;
      window.__xtendEpic13ProdCspSmokeResult.completedAt = new Date().toISOString();
    }

    function waitFor(predicate, timeoutMs) {
      const started = Date.now();
      return new Promise((resolve, reject) => {
        function tick() {
          let result = false;
          try {
            result = Boolean(predicate());
          } catch (error) {
            reject(error);
            return;
          }

          if (result) {
            resolve();
            return;
          }

          if (Date.now() - started > timeoutMs) {
            reject(new Error('Timed out while waiting for PROD CSP smoke predicate'));
            return;
          }

          requestAnimationFrame(tick);
        }

        tick();
      });
    }

    window.addEventListener('securitypolicyviolation', (event) => {
      window.__xtendEpic13ProdCspSmokeResult.errors.push(`csp:${event.violatedDirective}`);
    });

    window.addEventListener('error', (event) => {
      window.__xtendEpic13ProdCspSmokeResult.errors.push(event.message || 'window error');
    });

    window.addEventListener('unhandledrejection', (event) => {
      const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
      window.__xtendEpic13ProdCspSmokeResult.errors.push(reason);
    });

    async function runProdCspSmokeChecks() {
      const loader = document.querySelector('script[data-prod-csp-smoke="WP-E13-07"]');
      const manifestUrl = new URL(loader.dataset.manifest, window.location.href);

      recordCheck('prod csp meta policy present', Boolean(document.querySelector('meta[http-equiv="Content-Security-Policy"]')));
      recordCheck('prod csp scripts use nonce', Array.from(document.scripts).every((script) => script.nonce === 'xtend-e13-prod-csp-smoke'));
      recordCheck('prod csp manifest is same origin', manifestUrl.origin === window.location.origin);
      recordCheck('prod csp loader is same origin', new URL(loader.src, window.location.href).origin === window.location.origin);
      recordCheck('prod csp no importmap bridge', !document.querySelector('script[type="' + 'importmap' + '"]'));

      if (window.__XTendLoaderBootPromise) {
        await window.__XTendLoaderBootPromise;
      }

      await waitFor(() => window.XTendLoader && window.XTend && window.xstate && customElements.get('x-router'), 6000);
      recordCheck('loader boot promise resolved under csp', Boolean(window.XTendLoader && window.XTend));
      recordCheck('manifest policy kept loader local', loader.dataset.manifest === '/tests/browser/fixtures/components/manifest.json');
      recordCheck('xstate available once under csp', Boolean(window.xstate && typeof window.xstate.get === 'function'));

      window.xstate.set('router-navigate', '/detail');
      await waitFor(() => {
        const current = window.xstate.get('router-current');
        return current && current.component === 'xtend-prod-csp-detail';
      }, 4000);
      recordCheck('router route rendered under csp', Boolean(document.querySelector('#prod-csp-router').shadowRoot.querySelector('xtend-prod-csp-detail')));
      recordCheck('no csp violation recorded', !window.__xtendEpic13ProdCspSmokeResult.errors.some((entry) => String(entry).startsWith('csp:')));

      complete(window.__xtendEpic13ProdCspSmokeResult.errors.length === 0 ? 'passed' : 'failed');
    }

    window.addEventListener('load', () => {
      runProdCspSmokeChecks().catch((error) => {
        window.__xtendEpic13ProdCspSmokeResult.errors.push(error && error.message ? error.message : String(error));
        complete('failed');
      });
    });
  </script>
</body>
</html>
