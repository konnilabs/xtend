<!doctype html>
<html lang="en" data-contract="xtend.epic12.visual-snapshot-fixture.v1" data-theme="light" data-density="comfortable" data-motion="default-motion" data-viewport="desktop-1280">
  <head>
    <meta charset="utf-8">
    <title>XTend Epic 12 Visual Snapshots Fixture</title>
    <meta
      name="xtend-preload"
      content="xstate,x-theme,x-router,x-link,x-tabs,x-input,x-select,x-checkbox,x-form,x-alert,x-toast,x-status,x-progress,x-modal,x-drawer,x-section,x-cards,x-code,x-player"
    >
    <style>
      :root {
        --xtend-surface: #ffffff;
        --xtend-text: #1f2635;
        --xtend-color-primary: #4fc3f7;
        --xtend-density-spacing: 0.75rem;
        --xtend-radius: 18px;
      }

      :root[data-theme="dark"] {
        --xtend-surface: #1f2635;
        --xtend-text: #f5f7fb;
        --xtend-color-primary: #4fc3f7;
      }

      :root[data-theme="high-contrast"] {
        --xtend-surface: #000000;
        --xtend-text: #ffffff;
        --xtend-color-primary: #ffff00;
      }

      :root[data-theme="forced-colors"] {
        --xtend-surface: Canvas;
        --xtend-text: CanvasText;
        --xtend-color-primary: Highlight;
      }

      :root[data-density="compact"] {
        --xtend-density-spacing: 0.5rem;
      }

      :root[data-density="dense"] {
        --xtend-density-spacing: 0.375rem;
      }

      :root[data-motion="reduced-motion"] * {
        transition-duration: 0ms !important;
        animation-duration: 0ms !important;
      }

      body {
        visibility: hidden;
        margin: 0;
        color: var(--xtend-text);
        background: var(--xtend-surface);
        font-family: system-ui, sans-serif;
      }

      main {
        display: grid;
        gap: var(--xtend-density-spacing);
        padding: var(--xtend-density-spacing);
      }

      .snapshot-panel {
        border: 2px solid var(--xtend-color-primary);
        border-radius: var(--xtend-radius);
        display: grid;
        gap: var(--xtend-density-spacing);
        padding: var(--xtend-density-spacing);
      }
    </style>
  </head>
  <body>
    <main id="visual-snapshot-root" data-snapshot-runner="dom-first" data-rmt-shell="shell-first">
      <section
        class="snapshot-panel"
        data-snapshot-family="form-controls"
        data-snapshot-states="default focus invalid disabled"
        data-snapshot-scopes="shell-structure visual-state theme-token-state viewport-layout focus-a11y-state"
      >
        <x-form id="snapshot-form" aria-label="Snapshot form">
          <x-input id="snapshot-input" name="email" required placeholder="Email">
            <span slot="label">Email</span>
            <span slot="error">Email is required.</span>
          </x-input>
          <x-select id="snapshot-select" name="plan" required placeholder="Plan" label="Plan" invalid>
            <option value="team">Team</option>
            <option value="enterprise">Enterprise</option>
          </x-select>
          <x-checkbox id="snapshot-checkbox" name="terms" value="accepted" label="Terms accepted" disabled></x-checkbox>
        </x-form>
      </section>

      <section
        class="snapshot-panel"
        data-snapshot-family="feedback-status"
        data-snapshot-states="info success warning error progress"
        data-snapshot-scopes="shell-structure visual-state theme-token-state motion-density-state focus-a11y-state"
      >
        <x-alert id="snapshot-alert" type="warning" title="Snapshot warning">Warning shell</x-alert>
        <x-toast id="snapshot-toast" type="info" duration="0">Info shell</x-toast>
        <x-status id="snapshot-status" type="success" state="ready" label="Scheduler" message="Ready">Ready</x-status>
        <x-progress id="snapshot-progress" label="Hydration" status="Hydrated" value="64" max="100"></x-progress>
      </section>

      <section
        class="snapshot-panel"
        data-snapshot-family="navigation-routing"
        data-snapshot-states="initial-route active-route route-announced tab-selected tab-focus-visible"
        data-snapshot-scopes="shell-structure visual-state theme-token-state viewport-layout rmt-shell-descriptor"
        data-rmt-shell-descriptor="xtend.rmt.shell.navigation-routing"
      >
        <x-link id="snapshot-link" href="/" aria-current="page">Overview</x-link>
        <x-router id="snapshot-router" mode="hash">
          <x-route path="/" component="xtend-visual-snapshot-route"></x-route>
        </x-router>
        <x-tabs id="snapshot-tabs" selected="0" data-rmt-schedule="ui.user-blocking.tabs">
          <x-tab name="Overview">Overview tab</x-tab>
          <x-tab name="Telemetry">Telemetry tab</x-tab>
        </x-tabs>
      </section>

      <section
        class="snapshot-panel"
        data-snapshot-family="overlay-interaction"
        data-snapshot-states="closed open focus-trapped reduced-motion-open"
        data-snapshot-scopes="shell-structure visual-state motion-density-state viewport-layout focus-a11y-state"
      >
        <x-modal id="snapshot-modal" title="Snapshot modal" content="Modal shell" overlay></x-modal>
        <x-drawer id="snapshot-drawer" label="Snapshot drawer">
          <span slot="trigger">Open drawer</span>
          <p>Drawer shell</p>
        </x-drawer>
      </section>

      <section
        class="snapshot-panel"
        data-snapshot-family="layout-display-media"
        data-snapshot-states="default-layout narrow-layout lazy-media-shell"
        data-snapshot-scopes="shell-structure visual-state theme-token-state viewport-layout rmt-shell-descriptor"
        data-rmt-shell-descriptor="xtend.rmt.shell.layout-display-media"
      >
        <x-section id="snapshot-section" label="Layout shell">
          <x-cards id="snapshot-cards">
            <x-card title="Card">Display shell</x-card>
          </x-cards>
          <x-code id="snapshot-code" language="js">console.log("visual-snapshot");</x-code>
          <x-player id="snapshot-player" title="Lazy media shell"></x-player>
        </x-section>
      </section>
    </main>

    <script>
      class XTendVisualSnapshotRoute extends HTMLElement {
        connectedCallback() {
          this.textContent = 'Visual snapshot route';
        }
      }

      customElements.define('xtend-visual-snapshot-route', XTendVisualSnapshotRoute);

      const result = {
        contract: 'xtend.epic12.visual-snapshot-fixture.v1',
        runnerContract: 'xtend.epic12.visual-snapshot-runner.v1',
        status: 'pending',
        checks: [],
        snapshots: [],
        errors: []
      };

      window.__xtendEpic12VisualSnapshotsResult = result;

      function recordCheck(name, passed, details = {}) {
        result.checks.push({ name, passed: Boolean(passed), details });
        if (!passed) {
          result.errors.push(name);
        }
      }

      function readTokens() {
        const style = getComputedStyle(document.documentElement);
        return {
          '--xtend-surface': style.getPropertyValue('--xtend-surface').trim(),
          '--xtend-text': style.getPropertyValue('--xtend-text').trim(),
          '--xtend-color-primary': style.getPropertyValue('--xtend-color-primary').trim(),
          '--xtend-density-spacing': style.getPropertyValue('--xtend-density-spacing').trim(),
          '--xtend-radius': style.getPropertyValue('--xtend-radius').trim()
        };
      }

      function snapshotPanel(panel) {
        return {
          schema: 'xtend.epic12.visual-snapshot-record.v1',
          family: panel.dataset.snapshotFamily,
          visualStates: panel.dataset.snapshotStates.split(/\s+/),
          snapshotScopes: panel.dataset.snapshotScopes.split(/\s+/),
          components: Array.from(panel.querySelectorAll(':scope > *, :scope x-form > *'))
            .map((element) => element.localName)
            .filter((tag, index, all) => tag.startsWith('x-') && all.indexOf(tag) === index),
          dimensions: {
            theme: document.documentElement.dataset.theme,
            density: document.documentElement.dataset.density,
            motion: document.documentElement.dataset.motion,
            viewport: document.documentElement.dataset.viewport
          },
          tokens: readTokens(),
          rmtShellDescriptor: panel.dataset.rmtShellDescriptor || null
        };
      }

      function complete() {
        result.status = result.errors.length === 0 ? 'passed' : 'failed';
      }

      async function runFixture() {
        try {
          await (window.__XTendLoaderBootPromise || Promise.resolve());
          await Promise.all([
            customElements.whenDefined('x-router'),
            customElements.whenDefined('x-link'),
            customElements.whenDefined('x-tabs'),
            customElements.whenDefined('x-input'),
            customElements.whenDefined('x-select'),
            customElements.whenDefined('x-checkbox'),
            customElements.whenDefined('x-form'),
            customElements.whenDefined('x-alert'),
            customElements.whenDefined('x-toast'),
            customElements.whenDefined('x-status'),
            customElements.whenDefined('x-progress'),
            customElements.whenDefined('x-modal'),
            customElements.whenDefined('x-drawer'),
            customElements.whenDefined('x-section'),
            customElements.whenDefined('x-cards'),
            customElements.whenDefined('x-code'),
            customElements.whenDefined('x-player')
          ]);

          await new Promise((resolve) => requestAnimationFrame(resolve));
          const panels = Array.from(document.querySelectorAll('[data-snapshot-family]'));
          result.snapshots = panels.map(snapshotPanel);

          recordCheck('visual snapshots fixture hydrated local loader', Boolean(window.XTend && window.xstate));
          recordCheck('visual snapshots fixture exposes five family snapshots', result.snapshots.length === 5);
          recordCheck('visual snapshots fixture keeps shell first root', document.getElementById('visual-snapshot-root').dataset.rmtShell === 'shell-first');
          recordCheck('visual snapshots form controls snapshot state', Boolean(document.getElementById('snapshot-form')));
          recordCheck('visual snapshots feedback status snapshot state', Boolean(document.getElementById('snapshot-status')));
          recordCheck('visual snapshots navigation rmt descriptor state', Boolean(document.querySelector('[data-rmt-shell-descriptor="xtend.rmt.shell.navigation-routing"]')));
          recordCheck('visual snapshots overlay focus snapshot state', Boolean(document.getElementById('snapshot-modal')));
          recordCheck('visual snapshots layout media snapshot state', Boolean(document.getElementById('snapshot-player')));
          const forbiddenCdn = 'https://' + 'cdn.ccs-networks.de/xtend';
          recordCheck('visual snapshots fixture remains local only', !document.documentElement.outerHTML.includes(forbiddenCdn));
        } catch (error) {
          result.errors.push(error.message);
        } finally {
          complete();
        }
      }

      document.addEventListener('DOMContentLoaded', runFixture);
    </script>
    <script
      type="module"
      src="/xtend-loader.js"
      data-manifest="/tests/browser/fixtures/components/manifest.json"
    ></script>
  </body>
</html>
