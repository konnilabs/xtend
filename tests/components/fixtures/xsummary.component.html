<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x-summary component fixture</title>
</head>
<body>
  <x-summary id="component-summary" type="info" open>
    <span slot="title">Build details</span>
    <p>Contract-gated summary content.</p>
  </x-summary>
  <script>
    window.__xtendComponentState = {};
    window.__xtendComponentResult = { status: 'pending', checks: [], errors: [] };
    window.xstate = {
      get(key) { return window.__xtendComponentState[key]; },
      set(key, value) { window.__xtendComponentState[key] = value; },
      subscribe() { return function unsubscribe() {}; }
    };
  </script>
  <script type="module" src="/components/xsummary.js"></script>
</body>
</html>
