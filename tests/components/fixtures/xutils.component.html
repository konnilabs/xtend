<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x-utils utility boundary fixture</title>
</head>
<body>
  <main id="xutils-boundary-fixture" data-boundary="utility-probe"></main>

  <script type="module">
    import { XUtils } from '/components/xutils.js';

    window.__xtendComponentResult = [];
    window.__xtendXUtilsEvents = [];

    const record = (name, passed, detail = {}) => {
      window.__xtendComponentResult.push({ name, passed: Boolean(passed), detail });
    };

    window.addEventListener('xutils:import-policy-check', (event) => {
      window.__xtendXUtilsEvents.push(event.detail);
    });
    window.addEventListener('xutils:ui-effects-change', (event) => {
      window.__xtendXUtilsEvents.push(event.detail);
    });

    const root = document.getElementById('xutils-boundary-fixture');
    const button = XUtils.create('button', {
      className: 'xutils-action',
      textContent: 'Run utility probe'
    });
    root.appendChild(button);

    let delegated = false;
    const cleanup = XUtils.delegate(root, '.xutils-action', 'click', () => {
      delegated = true;
    });
    button.click();
    cleanup();

    XUtils.setAria(button, { label: 'Utility probe action', busy: 'false' });
    const localImport = XUtils.assertLocalImport('/components/xbutton.js');
    const externalImport = XUtils.assertLocalImport('https://example.invalid/xtend/components/xstate.js');
    const snapshot = XUtils.snapshotUtilityContract();
    const card = XUtils.XTemplate.card({
      title: 'Utility Contract',
      content: 'Boundary ready'
    });
    const effectTarget = document.createElement('div');
    const rmtEffectsDocument = {
      kind: 'rmt_document',
      components: [
        {
          id: 'app.ui-effects',
          kind: 'ui_effects',
          tag: 'ui-effects',
          props: { effect: 'fade-in' }
        }
      ]
    };
    const resolvedEffects = XUtils.resolveUiEffects({
      target: effectTarget,
      body: false,
      rmtDocument: rmtEffectsDocument
    });
    const preparedEffects = XUtils.prepareUiEffects(resolvedEffects);
    const releasedEffects = XUtils.releaseUiEffects(preparedEffects);

    const hostFadeBody = document.createElement('div');
    hostFadeBody.setAttribute('xt-ui-effects', 'fade-in');
    const hostFadeTarget = document.createElement('div');
    const hostileRmtEffectsDocument = {
      kind: 'rmt_document',
      components: [
        { uiEffects: 'none' },
        { tag: 'ui-effects', props: { effect: 'none' } }
      ]
    };
    const hostFadeResolvedEffects = XUtils.resolveUiEffects({
      target: hostFadeTarget,
      body: hostFadeBody,
      rmtDocument: hostileRmtEffectsDocument
    });
    const hostFadeReleasedEffects = XUtils.releaseUiEffects(XUtils.prepareUiEffects(hostFadeResolvedEffects));

    record('utility contract exposed', XUtils.xtendUtilityContract.schema === 'xtend.utility.module-contract.v1');
    record('import policy exposed', XUtils.xtendImportPolicy.schema === 'xtend.utility.import-policy.v1');
    record('local import allowed', localImport.allowed === true);
    record('external import blocked', externalImport.allowed === false && externalImport.reason === 'external-import-blocked');
    record('delegate cleanup returned', typeof cleanup === 'function' && delegated === true);
    record('aria helper wrote label', button.getAttribute('aria-label') === 'Utility probe action');
    record('template recipe created card', card.className === 'x-card' && card.textContent.includes('Boundary ready'));
    record('snapshot schema exposed', snapshot.schema === 'xtend.utility.boundary-probe.v1');
    record('kernel boundary preserved', snapshot.utility.kernelBoundary === 'no-rmt-kernel-import-of-xtend-types');
    record('policy event dispatched', window.__xtendXUtilsEvents.some((entry) => entry.schema === 'xtend.utility.import-policy-result.v1'));
    record('ui effects resolve rmt tag', resolvedEffects.schema === 'xtend.utility.ui-effects.v1' && resolvedEffects.active === true && resolvedEffects.effects.includes('fade-in'));
    record('ui effects prepare hides target', preparedEffects.prepared === true && effectTarget.style.visibility === 'hidden' && effectTarget.style.opacity === '0');
    record('ui effects release reveals target', releasedEffects.released === true && effectTarget.getAttribute('data-xt-ui-effects-ready') === 'true' && effectTarget.style.visibility === 'visible');
    record('ui effects event dispatched', window.__xtendXUtilsEvents.some((entry) => entry.schema === 'xtend.utility.ui-effects.v1' && entry.phase === 'release'));
    record('ui effects host fade survives rmt none', hostFadeResolvedEffects.active === true && hostFadeResolvedEffects.disabled === false && hostFadeResolvedEffects.effects.includes('fade-in'));
    record('ui effects host fade releases after rmt none', hostFadeReleasedEffects.released === true && hostFadeTarget.getAttribute('data-xt-ui-effects-ready') === 'true' && hostFadeTarget.style.visibility === 'visible');

    document.body.dataset.xutilsBoundaryReady = 'true';
  </script>
</body>
</html>
