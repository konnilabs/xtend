<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>XTend SurfaceManager Layout Engines Fixture</title>
  <script type="module" src="/components/xsurfacemanager.js"></script>
  <script type="module" src="/components/xsurfacewindow.js"></script>
  <script type="module" src="/components/xsidepanel.js"></script>
  <style>
    body {
      margin: 0;
      font: 16px/1.5 system-ui, sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    x-surface-manager {
      min-height: 720px;
      width: 100vw;
    }
  </style>
</head>
<body>
  <x-surface-manager
    id="layout-engine-manager"
    manager-id="docs.layout-engines"
    layout-engine="split"
    surface-layout-gap="12"
    surface-layout-snap="8"
    surface-loading-policy="open">
    <x-surface-window
      slot="windows"
      id="editor-window"
      surface-id="editor-window"
      label="Editor"
      initial-x="47"
      initial-y="51"
      initial-width="540"
      initial-height="360"
      open>
      <button type="button">Editor action</button>
    </x-surface-window>

    <x-surface-window
      slot="windows"
      id="preview-window"
      surface-id="preview-window"
      label="Preview"
      initial-x="220"
      initial-y="80"
      initial-width="520"
      initial-height="360"
      open>
      <button type="button">Preview action</button>
    </x-surface-window>

    <x-side-panel
      slot="panels"
      id="inspector-panel"
      surface-id="inspector-panel"
      label="Inspector"
      mode="docked"
      placement="right"
      initial-width="320"
      open>
      <button type="button">Inspector action</button>
    </x-side-panel>
  </x-surface-manager>

  <x-surface-manager
    id="document-flow-manager"
    manager-id="docs.document-flow"
    layout-engine="document-flow"
    aria-label="Document flow surfaces">
    <section slot="windows" data-flow-child="intro">Intro content</section>
    <form slot="windows" data-flow-child="form">
      <label>Text <textarea rows="4"></textarea></label>
    </form>
    <section slot="windows" data-flow-child="history">History content</section>
  </x-surface-manager>

  <script type="module">
    const manager = document.getElementById('layout-engine-manager');
    const documentFlowManager = document.getElementById('document-flow-manager');
    await customElements.whenDefined('x-surface-manager');
    await customElements.whenDefined('x-surface-window');
    await customElements.whenDefined('x-side-panel');
    const split = manager.snapshotSurfaceLayout();
    manager.applyLayoutEngine('tile', { source: 'fixture-tile' });
    manager.dockSurface('inspector-panel', 'left', 'docked');
    manager.undockSurface('inspector-panel', { x: 40, y: 40, width: 300, height: 420 });
    const finalLayout = manager.snapshotSurfaceLayout();
    const documentFlow = documentFlowManager.applyLayoutEngine('document-flow', {
      source: 'fixture-document-flow',
      commit: true
    });
    const documentFlowWorkspace = documentFlowManager.shadowRoot.querySelector('.workspace');
    const documentFlowWorkspaceStyle = getComputedStyle(documentFlowWorkspace);
    const documentFlowManagerStyle = getComputedStyle(documentFlowManager);
    window.__xtendComponentResult = {
      schema: 'xtend.surface.layout-engine.fixture-result.v1',
      ok: true,
      splitEngine: split.engine,
      finalEngine: finalLayout.engine,
      surfaceCount: finalLayout.surfaceCount,
      snapshotCompatible: finalLayout.snapshotCompatible,
      documentFlow: {
        engine: documentFlow.engine,
        requestedEngine: documentFlow.requestedEngine,
        committed: documentFlow.committed,
        surfaceCount: documentFlow.surfaceCount,
        workspacePosition: documentFlowWorkspaceStyle.position,
        workspaceDisplay: documentFlowWorkspaceStyle.display,
        hostOverflow: documentFlowManagerStyle.overflow,
        childCount: documentFlowManager.querySelectorAll('[data-flow-child]').length
      }
    };
  </script>
</body>
</html>
