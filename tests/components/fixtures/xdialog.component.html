<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x-dialog component fixture</title>
</head>
<body>
  <x-dialog
    id="component-dialog"
    open
    overlay
    title="Component dialog"
    width="420px"
    height="auto">
    <button>Confirm</button>
  </x-dialog>
  <script>
    window.__xtendComponentState = {};
    window.__xtendComponentResult = { status: 'pending', checks: [], errors: [] };
    window.XTend.state = {
      get(key) { return window.__xtendComponentState[key]; },
      set(key, value) { window.__xtendComponentState[key] = value; },
      subscribe() { return function unsubscribe() {}; }
    };
  </script>
  <script type="module" src="/components/xdialog.js"></script>
</body>
</html>
