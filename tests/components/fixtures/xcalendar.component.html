<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x-calendar component fixture</title>
</head>
<body>
  <x-calendar id="component-calendar" name="date" data-contract-date="2026-05-06"></x-calendar>
  <script>
    window.__xtendComponentState = {};
    window.__xtendComponentResult = { status: 'pending', checks: [], errors: [] };
    window.XTend.state = {
      get(key) { return window.__xtendComponentState[key]; },
      set(key, value) { window.__xtendComponentState[key] = value; },
      subscribe() { return function unsubscribe() {}; }
    };
  </script>
  <script type="module" src="/components/xcalendar.js"></script>
</body>
</html>
