<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x-menu component fixture</title>
  <style>
    [data-xtend-nav-theme="enterprise-foreign"] x-menu {
      --xtend-nav-surface: #f7f4ee;
      --xtend-nav-text: #19231f;
      --xtend-nav-border-color: rgba(25, 35, 31, 0.24);
      --xtend-nav-radius: 0.4rem;
      --xtend-nav-gap: 0.35rem;
      --xtend-nav-font-family: "Aptos", "Segoe UI", sans-serif;
      --xtend-nav-font-size: 0.96rem;
      --xtend-nav-active-surface: #173f35;
      --xtend-nav-active-text: #fffaf0;
      --xtend-nav-current-indicator: #b56b35;
      --xtend-nav-hover-surface: rgba(181, 107, 53, 0.14);
      --xtend-nav-focus-ring: 3px solid #b56b35;
      --xtend-nav-disabled-opacity: 0.44;
    }
  </style>
</head>
<body data-xtend-nav-theme="enterprise-foreign">
  <x-router id="component-router" mode="hash">
    <x-route path="/overview" component="demo-overview"></x-route>
    <x-route path="/settings" component="demo-settings"></x-route>
  </x-router>
  <x-menu
    id="component-menu"
    data-rmt-schedule="ui.user-blocking.navigation"
    data-xtend-lane="user-blocking">
    <a href="/overview" aria-current="page">Overview</a>
    <button type="button">Action</button>
    <x-link href="/settings" aria-selected="true">Settings</x-link>
    <span role="menuitem">Custom item</span>
    <button type="button" disabled>Disabled item</button>
    <button type="button" aria-expanded="false" aria-haspopup="menu" data-menu-disclosure>
      Lang benannter verschachtelter Navigationspunkt fuer Enterprise Informationsarchitektur
      <svg part="disclosure-icon control icon" data-disclosure-icon viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </x-menu>
  <x-menu id="secondary-menu" aria-label="Secondary navigation">
    <a href="/secondary">Secondary overview</a>
    <a href="/secondary/settings">Secondary settings</a>
  </x-menu>
  <script>
    window.__xtendComponentState = {};
    window.__xtendComponentResult = { status: 'pending', checks: [], errors: [] };
    window.__xtendMenuInteractions = [];
    window.__xtendMenuNavigation = [];
    window.__xtendMenuMeasurements = [];
    window.xstate = {
      get(key) { return window.__xtendComponentState[key]; },
      set(key, value) { window.__xtendComponentState[key] = value; },
      subscribe() { return function unsubscribe() {}; }
    };
    document.addEventListener('menu-item-clicked', (event) => {
      window.__xtendMenuInteractions.push(event.detail);
    });
    document.addEventListener('menu-navigate', (event) => {
      window.__xtendMenuNavigation.push(event.detail);
    });
    document.addEventListener('menu-performance-measured', (event) => {
      window.__xtendMenuMeasurements.push(event.detail);
    });
  </script>
  <script type="module" src="/components/xmenu.js"></script>
  <script type="module">
    const result = window.__xtendComponentResult;
    const record = (name, passed, detail = {}) => {
      result.checks.push({ name, passed, detail });
      if (!passed) result.errors.push(name);
    };

    await customElements.whenDefined('x-menu');
    const menu = document.getElementById('component-menu');
    const items = Array.from(menu.querySelectorAll('a, button, x-link, [role="menuitem"]'));
    const secondaryMenu = document.getElementById('secondary-menu');
    const secondaryItems = Array.from(secondaryMenu.querySelectorAll('a, button, x-link, [role="menuitem"]'));

    const stateWritesBeforeIsolationCheck = window.xstate.snapshotDiagnostics().operationCounts.set;
    window.xstate.set('xmenu-active', {
      schema: 'xtend.component.x-menu.state.v1',
      id: 'component-menu',
      index: 1,
      activeIndex: 1,
      focus: false
    });
    const stateWritesAfterIsolationCheck = window.xstate.snapshotDiagnostics().operationCounts.set;
    const secondaryActiveIndex = secondaryItems.findIndex((item) => item.getAttribute('aria-current') === 'page');
    const secondaryFocusIndex = secondaryItems.findIndex((item) => item.tabIndex === 0);

    items[0].dispatchEvent(new KeyboardEvent('keydown', {
      key: 'ArrowRight',
      bubbles: true,
      composed: true,
      cancelable: true
    }));
    items[1].click();
    items[2].click();

    const state = window.xstate.get('xmenu-state-component-menu');
    const snapshot = menu.snapshotPerformance();
    const interactionBudget = menu.getInteractionBudget();

    record('menu state synchronized', state && state.schema === 'xtend.component.x-menu.state.v1');
    record('parallel menu does not synthesize current page', secondaryActiveIndex === -1);
    record('parallel menu retains roving focus', secondaryFocusIndex === 0);
    record('parallel menu state avoids feedback writes', stateWritesAfterIsolationCheck - stateWritesBeforeIsolationCheck <= 3, {
      stateWrites: stateWritesAfterIsolationCheck - stateWritesBeforeIsolationCheck
    });
    record('performance snapshot available', snapshot && snapshot.schema === 'xtend.component.performance-snapshot.v1');
    record('interaction budget exposes touch target', interactionBudget && interactionBudget.touchTargetMinPx === 44);
    record('keyboard navigation measured', window.__xtendMenuMeasurements.some((entry) => entry.name === 'xtend.interaction.keyboard'));
    record('menu item clicked event emitted', window.__xtendMenuInteractions.some((entry) => entry.index === 1));
    record('x-link route navigation emitted', window.__xtendMenuNavigation.some((entry) => entry.path === '/settings'));

    result.status = result.errors.length === 0 ? 'passed' : 'failed';
  </script>
</body>
</html>
