<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x-code component fixture</title>
  <style>
    [data-xtend-layout-theme="enterprise-foreign"] x-code {
      --xtend-layout-surface: #151b19;
      --xtend-layout-text: #f7f1e7;
      --xtend-layout-border-color: rgba(247, 241, 231, 0.18);
      --xtend-layout-radius: 0.35rem;
      --xtend-layout-elevation: 0 16px 40px rgba(21, 27, 25, 0.22);
      --xtend-layout-spacing: 1.25rem 1.4rem;
      --xtend-layout-gap: 0.75rem;
      --xtend-layout-font-family: "Cascadia Code", "Fira Mono", monospace;
      --xtend-layout-font-size: 0.95rem;
      --xtend-layout-media-radius: 999px;
      --xtend-layout-focus-ring: 3px solid #d48b57;
      --xtend-layout-grid-min: minmax(0, 1fr);
      --xtend-layout-content-max: 68rem;
    }
  </style>
</head>
<body data-xtend-layout-theme="enterprise-foreign">
  <x-code id="component-code" lang="js">
    <template>console.log('XTend');</template>
  </x-code>
  <x-code id="component-rmt-code" language="rmt">
    <template data-x-code-mode="text">template docs.demo { state app.ready type boolean initial true }</template>
  </x-code>
  <script>
    window.__xtendComponentState = {};
    window.__xtendComponentResult = { status: 'pending', checks: [], errors: [] };
    window.xstate = {
      get(key) { return window.__xtendComponentState[key]; },
      set(key, value) { window.__xtendComponentState[key] = value; },
      subscribe() { return function unsubscribe() {}; }
    };
  </script>
  <script type="module" src="/components/xcode.js"></script>
</body>
</html>
