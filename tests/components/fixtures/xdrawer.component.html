<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>x-drawer component fixture</title>
    <script type="module" src="/components/xstate.js"></script>
    <script type="module" src="/components/xdrawer.js"></script>
  </head>
  <body>
    <x-drawer
      id="component-drawer"
      placement="left"
      modal
      label="App navigation"
      route-aware>
      <button slot="trigger" type="button">Open navigation</button>
      <strong slot="header">Navigation</strong>
      <a href="#/overview">Overview</a>
      <a href="#/settings">Settings</a>
      <small slot="footer">Signed in</small>
    </x-drawer>
    <script>
      window.xstate = window.xstate || {
        get: () => null,
        set: () => {},
        subscribe: () => () => {}
      };
      window.__xtendComponentResult = {
        component: 'x-drawer',
        id: 'component-drawer',
        expectedEvents: ['drawer-opened', 'drawer-closed', 'drawer-route-selected'],
        stateKey: 'xdrawer-open-component-drawer'
      };
    </script>
  </body>
</html>
