<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMasonry Test</title>
  <script type="module" src="xtend-loader.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #007cba;
      color: white;
      padding: 1em;
      text-align: center;
    }

    main {
      padding: 2em;
    }

    button {
      margin-top: 1em;
      padding: 0.5em 1em;
      background-color: #007cba;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005a8c;
    }
  </style>
</head>
<body>
  <header>
    <h1>XMasonry Component Test</h1>
  </header>
  <main>
    <x-masonry column-width="200px" gap="1em" draggable>
      <div data-key="item1" data-title="Item 1">
        <p>This is the content of Item 1.</p>
      </div>
      <div data-key="item2" data-title="Item 2">
        <p>This is the content of Item 2.</p>
      </div>
      <div data-key="item3" data-title="Item 3">
        <p>This is the content of Item 3.</p>
      </div>
      <div data-key="item4" data-title="Item 4">
        <p>This is the content of Item 4.</p>
      </div>
    </x-masonry>

    <button onclick="addNewItem()">Add New Item</button>
  </main>

  <script>
    let itemCount = 4;

    function addNewItem() {
      const masonry = document.querySelector('x-masonry');
      const newItem = document.createElement('div');
      itemCount++;
      newItem.setAttribute('data-key', `item${itemCount}`);
      newItem.setAttribute('data-title', `Item ${itemCount}`);
      newItem.innerHTML = `<p>This is the content of Item ${itemCount}.</p>`;
      masonry.appendChild(newItem);
      masonry._render(); // Re-render the masonry layout
    }
  </script>
</body>
</html>
