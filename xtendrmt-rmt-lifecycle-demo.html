<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="xtend-preload" content="xstate,x-theme,x-section,x-cards,x-code,x-status,x-progress">
  <title>XTend RMT Lifecycle Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f5f7;
      color: #172033;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <div
    id="rmt-lifecycle-demo-root"
    data-rmt-lifecycle-demo-root
    data-rmt-template-src="xtendrmt/rmt-lifecycle-demo.rmt"
    data-rmt-core-src="xtendrmt/rmt-lifecycle-demo.core.json"
    data-scaffold-build="node xtend-builder/scaffold.js rmt-lifecycle-demo --write --json"
    aria-busy="true"></div>
  <script type="module" src="xtend-loader.js" data-manifest="components/manifest.json"></script>
  <script type="module">
    window.__XTendRmtLifecycleDemoBootPromise = (window.__XTendLoaderBootPromise || Promise.resolve())
      .then(() => import('./xtendrmt/rmt-lifecycle-demo.app.js'))
      .then((module) => module.bootRmtLifecycleDemo())
      .catch((error) => {
        window.__XTendRmtLifecycleDemoResult = {
          status: 'failed',
          schema: 'xtend.rmt.lifecycle-demo.v1',
          error: error.message
        };
        console.error('XTend RMT Lifecycle Demo failed', error);
      });
  </script>
</body>
</html>
