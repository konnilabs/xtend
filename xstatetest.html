<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>XState Demo</title>
  <script type="module" src="xtend-loader.js"></script>
  <link rel="stylesheet" href="xtend.css">
  <style>
    body {
      font-family: sans-serif;
      background: #222;
      color: #fff;
      padding: 2em;
    }
    x-button {
      margin: 0.5em;
    }
    .state-view {
      margin-top: 2em;
      background: #111;
      padding: 1em;
      border-radius: 8px;
      font-family: monospace;
      min-height: 3em;
    }
    .log {
      margin-top: 1em;
      font-size: 0.95em;
      color: #aaa;
      max-height: 120px;
      overflow-y: auto;
      background: #181818;
      border-radius: 6px;
      padding: 0.5em;
    }
  </style>
</head>
<body>
  <div id="xtend-app"></div>
  <h1>XState Demo</h1>
  <p>Experimentiere mit dem globalen State-Management von XTend (XState):</p>
  <div>
    <x-button id="inc">+1 Zähler</x-button>
    <x-button id="dec">-1 Zähler</x-button>
    <x-button id="set-user">Setze User</x-button>
    <x-button id="clear">State löschen</x-button>
  </div>
  <div class="state-view" id="state-view"></div>
  <div class="log" id="log"></div>
  <script type="module">
    Promise.resolve(window.__XTendLoaderBootPromise).then(() => {
      const { xstate } = window;
      const stateView = document.getElementById('state-view');
      const log = document.getElementById('log');

      xstate.set('counter', 0);
      xstate.set('user', { name: 'Anna', age: 28 });

      xstate.subscribe((key, value, all) => {
        stateView.textContent = JSON.stringify(all, null, 2);
        if (key) {
          const msg = `[${new Date().toLocaleTimeString()}] ${key}: ${JSON.stringify(value)}`;
          log.textContent = msg + "\n" + log.textContent;
        }
      });

      document.getElementById('inc').addEventListener('click', () => {
        const val = xstate.get('counter') || 0;
        xstate.set('counter', val + 1);
      });
      document.getElementById('dec').addEventListener('click', () => {
        const val = xstate.get('counter') || 0;
        xstate.set('counter', val - 1);
      });
      document.getElementById('set-user').addEventListener('click', () => {
        xstate.set('user', { name: 'Max', age: Math.floor(Math.random() * 50) + 20 });
      });
      document.getElementById('clear').addEventListener('click', () => {
        xstate.clear();
      });
    });
  </script>
</body>
</html>
