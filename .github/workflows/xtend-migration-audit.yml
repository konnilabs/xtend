name: XTend independent migration audit
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [codex/migration-main112-integration]
permissions:
  contents: read
jobs:
  union-source-artifact:
    name: Verify pinned union source artifact
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      core-sha: ${{ steps.pin.outputs.core-sha }}
      demo-sha: ${{ steps.pin.outputs.demo-sha }}
      archive-sha256: ${{ steps.produce.outputs.archive-sha256 }}
      manifest-sha256: ${{ steps.produce.outputs.manifest-sha256 }}
    steps:
      - name: Checkout exact Core event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: union-core
      - name: Verify Core identity and read immutable Demo pin
        id: pin
        env:
          EXPECTED_CORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          head = subprocess.check_output(['git', '-C', 'union-core', 'rev-parse', 'HEAD']).decode().strip()
          assert head == os.environ['EXPECTED_CORE_SHA']
          pin = json.load(open('union-core/product-demos.lock.json'))
          assert pin['repository'] == 'https://github.com/konnilabs/xtend-demos.git'
          assert re.fullmatch('[a-f0-9]{40}', pin['demoSha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('core-sha=' + head + '\n' + 'demo-sha=' + pin['demoSha'] + '\n')
          PYTHON
      - name: Checkout exact pinned Demo source without dependencies
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: konnilabs/xtend-demos
          ref: ${{ steps.pin.outputs.demo-sha }}
          path: union-demo
      - name: Produce verified regular-file source artifact
        id: produce
        env:
          EXPECTED_CORE_SHA: ${{ steps.pin.outputs.core-sha }}
          EXPECTED_DEMO_SHA: ${{ steps.pin.outputs.demo-sha }}
        run: |
          test "$(git -C union-demo rev-parse HEAD)" = "$EXPECTED_DEMO_SHA"
          python3 union-core/scripts/build-union-source-artifact.py --mode committed --core union-core --demo union-demo --core-sha "$EXPECTED_CORE_SHA" --output "$RUNNER_TEMP/union-source-produced" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 - <<'PYTHON'
          import json, os
          receipt = json.load(open(os.environ['RUNNER_TEMP'] + '/union-source-produced/producer-receipt.json'))
          assert receipt['producerMode'] == 'committed'
          assert receipt['coreSha'] == os.environ['EXPECTED_CORE_SHA'] and receipt['demoSha'] == os.environ['EXPECTED_DEMO_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('archive-sha256=' + receipt['archiveSha256'] + '\nmanifest-sha256=' + receipt['manifestSha256'] + '\n')
          PYTHON
      - name: Upload immutable same-run source artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-union-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/union-source-produced/sources.tar.gz
          if-no-files-found: error

  migration-audit:
    needs: union-source-artifact
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node_version: [24.18.0, 26.5.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false
      - name: Pin npm11.17
        run: npm install --global npm@11.17.0 --no-audit --fund=false
      - id: install_1
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Require successful source producer without fallback
        env:
          SOURCE_PRODUCER_RESULT: ${{ needs.union-source-artifact.result }}
          SOURCE_ARTIFACT_ID: ${{ needs.union-source-artifact.outputs.artifact-id }}
        run: |
          test "$SOURCE_PRODUCER_RESULT" = success
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[0-9]+$ ]]

      - name: Acquire exact same-run source artifact
        if: ${{ !cancelled() && steps.install_1.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.union-source-artifact.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/xtend-union-source/download

      - name: Verify independent head/pin and authenticated artifact expectations
        if: ${{ !cancelled() && steps.install_1.outcome == 'success' }}
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          EXPECTED_CORE_SHA: ${{ github.sha }}
          PRODUCER_CORE_SHA: ${{ needs.union-source-artifact.outputs.core-sha }}
          PRODUCER_DEMO_SHA: ${{ needs.union-source-artifact.outputs.demo-sha }}
          UNION_ARCHIVE_SHA256: ${{ needs.union-source-artifact.outputs.archive-sha256 }}
          UNION_MANIFEST_SHA256: ${{ needs.union-source-artifact.outputs.manifest-sha256 }}
          UNION_ARTIFACT_ID: ${{ needs.union-source-artifact.outputs.artifact-id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re, subprocess
          env = os.environ
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          assert head == env['EXPECTED_CORE_SHA'] == env['PRODUCER_CORE_SHA']
          assert re.fullmatch('[0-9]+', env['UNION_ARTIFACT_ID'])
          pin = json.load(open('product-demos.lock.json'))
          assert pin['repository'] == 'https://github.com/konnilabs/xtend-demos.git' and pin['demoSha'] == env['PRODUCER_DEMO_SHA']
          expected = dict(producerMode='committed', coreSha=head, demoSha=pin['demoSha'], archiveSha256=env['UNION_ARCHIVE_SHA256'], manifestSha256=env['UNION_MANIFEST_SHA256'], context=dict(runId=env['GITHUB_RUN_ID'], runAttempt=env['GITHUB_RUN_ATTEMPT']))
          target = pathlib.Path(env['RUNNER_TEMP']) / 'xtend-union-source' / 'expected.json'
          target.write_text(json.dumps(expected))
          with open(env['GITHUB_ENV'], 'a') as output:
              output.write('XTEND_UNION_ARCHIVE=' + env['RUNNER_TEMP'] + '/xtend-union-source/download/sources.tar.gz\nXTEND_UNION_EXPECTED=' + str(target) + '\nXTEND_UNION_ARTIFACT_ID=' + env['UNION_ARTIFACT_ID'] + '\n')
          PYTHON

      - name: Required portable union source-provider boundary tests
        if: ${{ !cancelled() && steps.install_1.outcome == 'success' }}
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_UNION_TEST_REPORT: .xtend-test-results/union-provider-tests.json
        run: |
          node --test tests/schemas/union_source_provider.test.cjs
          node --test tests/schemas/expected_inventory_view.test.cjs
          node --test tests/schemas/workflow_comparison.test.cjs
          node --test tests/schemas/release_union_binding.test.cjs

      - name: Required productive full-source union validation
        id: union_strict
        if: ${{ !cancelled() && steps.install_1.outcome == 'success' }}
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: node scripts/check-union-source.cjs --archive "$XTEND_UNION_ARCHIVE" --expected "$XTEND_UNION_EXPECTED" --destination "$RUNNER_TEMP/xtend-union-source/$XTEND_UNION_ARTIFACT_ID" --output .xtend-test-results/union-source-validation.json

      - name: Record exact Union runtime and report binding
        if: ${{ always() && !cancelled() && steps.install_1.outcome == 'success' }}
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          UNION_PRODUCER_RESULT: ${{ needs.union-source-artifact.result }}
          UNION_NODE_VERSION: ${{ matrix.node_version }}
          UNION_STRICT_RESULT: ${{ steps.union_strict.outcome }}
        run: node scripts/release/union.cjs record --execute

      - name: Preserve union validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-release-union-${{ matrix.node_version }}-attempt-${{ github.run_attempt }}
          path: |
            .xtend-test-results/union-source-validation.json
            .xtend-test-results/union-lane.json
          if-no-files-found: error

      - name: Retain migration portable/authority checks
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:product-boundary

  # Temporary measurement only. Existing portable gates and security integrations are unchanged.
  node-schema-diagnostic:
    name: Isolated Node schema comparison on one Linux runner
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'xtend-schema-profile-20261018' &&
          github.event.pull_request.number == 117 && github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == 'konnilabs/xtend' &&
          github.event.pull_request.head.ref == 'codex/core-unreleased-contract-registration' &&
          github.event.pull_request.base.sha == 'b77f1ada0ff6b953f05e192a8bc6d7943df70829' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DIAGNOSTIC_WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the identical measured source for every trial
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 03f413dc4bac743b34f68f4fab1727fab0343d84
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Retain Node 24 path and install the exact diagnostic npm
        run: |
          echo "DIAGNOSTIC_DIR=$RUNNER_TEMP/xtend-node-schema-diagnostic" >> "$GITHUB_ENV"
          echo "DIAG_NODE24=$(command -v node)" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/xtend-diagnostic-npm" npm@11.17.0 --ignore-scripts --no-audit --fund=false
          echo "DIAG_NPM_CLI=$RUNNER_TEMP/xtend-diagnostic-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Setup Node 26 on the same runner
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Retain Node 26 path and install locked workspace dependencies once
        run: |
          echo "DIAG_NODE26=$(command -v node)" >> "$GITHUB_ENV"
          "$DIAG_NODE24" "$DIAG_NPM_CLI" ci --ignore-scripts --no-audit --fund=false
      - name: Measure six serial trials with one authenticated capture
        id: measure
        run: |
          python3 - <<'PYDIAGNOSTIC'
          from pathlib import Path
          import datetime,hashlib,json,os,resource,shutil,subprocess,time

          root=Path.cwd();out=Path(os.environ['DIAGNOSTIC_DIR']);out.mkdir(parents=True,exist_ok=True)
          source='03f413dc4bac743b34f68f4fab1727fab0343d84'
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def now():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def write(p,data):Path(p).write_text(json.dumps(data,indent=2)+'\n')
          def optional(p):
              try:return Path(p).read_text()
              except OSError:return None
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==source
          assert not git('status','--porcelain','--untracked-files=no')
          capture=out/'source-capture'
          subprocess.run(['python3','scripts/build-core-source-artifact.py','--core',str(root),'--core-sha',source,'--output',str(capture),'--run-id',os.environ['GITHUB_RUN_ID'],'--run-attempt',os.environ['GITHUB_RUN_ATTEMPT']],check=True)
          receipt=json.loads((capture/'producer-receipt.json').read_text());archive=capture/'sources.tar.gz'
          assert receipt['sourceSha']==source and sha(archive)==receipt['archiveSha256']
          nodes={'24.18.0':Path(os.environ['DIAG_NODE24']),'26.5.0':Path(os.environ['DIAG_NODE26'])}
          npm=Path(os.environ['DIAG_NPM_CLI']);shim=out/'bin';shim.mkdir();(shim/'npm').symlink_to(npm)
          metadata={
              'sourceSha':source,'workflowHead':os.environ['DIAGNOSTIC_WORKFLOW_HEAD'],
              'capturedAt':now(),'receipt':receipt,'npmCliSha256':sha(npm),
              'runner':{k:os.environ.get(k) for k in ['RUNNER_NAME','RUNNER_OS','RUNNER_ARCH','ImageOS','ImageVersion','GITHUB_JOB','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_WORKFLOW_REF']},
              'platformScope':'Optional Linux-host observations only; no portable Core or development requirement',
              'optionalLinux':{p:optional(p) for p in ['/proc/cpuinfo','/sys/fs/cgroup/cpu.max','/sys/fs/cgroup/cpu.stat','/proc/pressure/cpu']},
              'runtimes':{},'originalSuiteTimeoutMs':300000,
              'design':'Plain 24, plain 26, profiled 24, profiled 26, plain 26, plain 24; serial on one runner. No OS cache flush. Overhead estimates are bracketed, not randomized.'}
          runtimeScript="const os=require('node:os');console.log(JSON.stringify({versions:process.versions,platform:process.platform,arch:process.arch,kernel:os.release(),cpuModel:os.cpus()[0]?.model,logicalCpus:os.cpus().length,availableParallelism:os.availableParallelism(),totalMemory:os.totalmem(),freeMemory:os.freemem(),loadAverage:os.loadavg()}))"
          for version,node in nodes.items():
              env=dict(os.environ,PATH=str(shim)+os.pathsep+str(node.parent)+os.pathsep+os.environ['PATH'])
              info=json.loads(subprocess.check_output([str(node),'-e',runtimeScript],env=env,text=True))
              assert info['versions']['node']==version
              info['nodeBinarySha256']=sha(node);info['npmVersion']=subprocess.check_output([str(node),str(npm),'--version'],env=env,text=True).strip()
              assert info['npmVersion']=='11.17.0';metadata['runtimes'][version]=info
          write(out/'metadata.json',metadata)
          sequence=[('24.18.0',False),('26.5.0',False),('24.18.0',True),('26.5.0',True),('26.5.0',False),('24.18.0',False)]
          results=[]
          for index,(version,profiled) in enumerate(sequence,1):
              assert sha(archive)==receipt['archiveSha256'] and git('rev-parse','HEAD')==source
              assert not git('status','--porcelain','--untracked-files=no')
              trial=out/f'{index:02d}-node-{version}-{"profiled" if profiled else "plain"}'
              trial.mkdir();node=nodes[version]
              env=dict(os.environ,PATH=str(shim)+os.pathsep+str(node.parent)+os.pathsep+os.environ['PATH'],XTEND_CORE_REQUIRED='true',XTEND_CORE_ARCHIVE=str(archive),XTEND_CORE_EXPECTED=str(capture/'producer-receipt.json'),XTEND_CI_LANE='node-24-lts' if version.startswith('24') else 'node-26-current',XTEND_NPM_CLI=str(npm),NODE_OPTIONS='--trace-warnings --trace-deprecation --require='+str(root/'scripts/node_warning_policy.cjs'))
              execution=trial/'execution.json';report=trial/'report.json'
              command=[str(node)]+(['--prof','--logfile='+str(trial/'v8-profile.log')] if profiled else [])+['scripts/run_xtend_tests.js','schema-inventory','--execution',str(execution),'--report',str(report)]
              row={'order':index,'node':version,'profiled':profiled,'startedAt':now(),'sourceSha':source,'archiveSha256':sha(archive),'command':command,'hostBefore':json.loads(subprocess.check_output([str(node),'-e',runtimeScript],env=env,text=True)),'cpuPressureBefore':optional('/proc/pressure/cpu'),'cpuStatBefore':optional('/sys/fs/cgroup/cpu.stat')}
              print(json.dumps({'startingTrial':index,'node':version,'profiled':profiled,'at':row['startedAt']}),flush=True)
              before=resource.getrusage(resource.RUSAGE_CHILDREN);start=time.monotonic();outerTimeout=False
              with (trial/'stdout.log').open('x') as log:
                  try:run=subprocess.run(command,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=360);exitCode=run.returncode
                  except subprocess.TimeoutExpired:outerTimeout=True;exitCode=None
              elapsed=time.monotonic()-start;after=resource.getrusage(resource.RUSAGE_CHILDREN)
              row.update(completedAt=now(),wallSeconds=round(elapsed,3),exitCode=exitCode,outerHarnessTimeout=outerTimeout,childCpuSeconds={'user':after.ru_utime-before.ru_utime,'system':after.ru_stime-before.ru_stime},cpuPressureAfter=optional('/proc/pressure/cpu'),cpuStatAfter=optional('/sys/fs/cgroup/cpu.stat'),archiveUnchanged=sha(archive)==receipt['archiveSha256'])
              if execution.exists():
                  data=json.loads(execution.read_text());row['executionStatus']=data['status'];row['complete']=data['complete'];row['infrastructureErrors']=data.get('infrastructureErrors',[])
                  entries=[r for r in data['results'] if r['result']['id']=='schema-inventory']
                  if entries:
                      entry=entries[0];row['schema']={k:entry.get(k) for k in ['durationMs','abortCause','rssBytes','maxRssBytes']};row['schema']['result']={k:entry['result'].get(k) for k in ['status','passCount','failureCount','skipCount','warningCount','failures']}
                      logPath=root/entry['logPath']
                      if logPath.is_file():shutil.copyfile(logPath,trial/'schema.log')
              row['profileLogs']=[{'name':p.name,'bytes':p.stat().st_size,'sha256':sha(p)} for p in sorted(trial.glob('*-v8-profile.log'))]
              write(trial/'summary.json',row);results.append(row);write(out/'results.json',results)
              print(json.dumps({k:v for k,v in row.items() if k not in ['command','hostBefore','profileLogs','cpuPressureBefore','cpuPressureAfter','cpuStatBefore','cpuStatAfter']}),flush=True)
              if outerTimeout or row.get('infrastructureErrors') or not row['archiveUnchanged']:
                  print('Stopping subsequent measurements after infrastructure/identity failure; earlier failures remain recorded.',flush=True);break
          PYDIAGNOSTIC
      - name: Decode retained CPU logs with their exact Node runtime
        if: ${{ always() && steps.measure.outcome != 'skipped' }}
        run: |
          python3 - <<'PYPROFILE'
          from pathlib import Path
          import json,os,subprocess
          root=Path(os.environ['DIAGNOSTIC_DIR']);results=[]
          for folder in sorted(root.glob('*-node-*-profiled')):
              node=os.environ['DIAG_NODE24' if '24.18.0' in folder.name else 'DIAG_NODE26']
              for log in sorted(folder.glob('*-v8-profile.log')):
                  row={'rawLog':str(log.relative_to(root))}
                  with (folder/(log.name+'.processed.txt')).open('w') as output:
                      try:
                          run=subprocess.run([node,'--prof-process',str(log)],stdout=output,stderr=subprocess.STDOUT,timeout=120)
                          row['exitCode']=run.returncode
                      except subprocess.TimeoutExpired:row['decodeTimedOut']=True
                  results.append(row)
          root.mkdir(parents=True,exist_ok=True)
          (root/'profile-decoding.json').write_text(json.dumps(results,indent=2)+'\n')
          PYPROFILE
      - name: Preserve diagnostic results including failed or timed out trials
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xtend-node-schema-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xtend-node-schema-diagnostic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Report actual trial outcome without waiving any gate
        if: ${{ always() }}
        run: |
          python3 - <<'PYRESULT'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['DIAGNOSTIC_DIR'])/'results.json').read_text())
          assert len(rows)==6, 'Not all six measurements completed'
          assert all(r['archiveUnchanged'] for r in rows), 'Capture changed'
          assert all(r['exitCode']==0 and r['complete'] and not r['infrastructureErrors'] and
                     r['schema']['result']['passCount']==27 and r['schema']['result']['failureCount']==0 and
                     r['schema']['result']['skipCount']==0 for r in rows), 'A schema trial failed; retained evidence is authoritative'
          PYRESULT
