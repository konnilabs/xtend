name: XTend CI regression probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'codex/fix-laravel-ci-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Pin npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false
      - name: Compare checkout and installed source identity
        run: |
          git status --short --untracked-files=all
          npm ci --ignore-scripts --no-audit --fund=false
          git status --short --untracked-files=all
          git diff --stat
          git ls-files --others --exclude-standard
      - name: Verify Nightly installation phases
        run: |
          node scripts/test-runner/nightly.js begin
          node scripts/test-runner/nightly.js phase lock_guard
          node scripts/test-runner/nightly.js phase install_1
          node scripts/test-runner/nightly.js phase install_2
          node scripts/test-runner/nightly.js phase capabilities
      - name: Verify conditional network evidence
        run: npm run conditional-network:evidence
      - name: Run focused regression suites
        run: node scripts/run_xtend_tests.js rmt-jit-hydrangea maraca-size-budget maraca-app-services-build test-runner --json
