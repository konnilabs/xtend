            node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: windows-2025-x64-node-26-5-0
          - runner: macos-15
            runner_label: macos-15-arm64
            expected_platform: darwin
            expected_arch: arm64
            node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: macos-15-arm64-node-24-18-0
          - runner: macos-15
            runner_label: macos-15-arm64
            expected_platform: darwin
            expected_arch: arm64
            node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: macos-15-arm64-node-26-5-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure npm download cache
        run: node scripts/configure_npm_cache.js

      - name: Restore npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xtend-npm-cache
          key: xtend-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'products/xtend-llm/package-lock.json', 'products/resumability-maraca-erp-demo/package-lock.json') }}

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          architecture: ${{ matrix.expected_arch }}
          package-manager-cache: false

      - name: Verify runner OS and architecture
        run: node -e "const expected={platform:'${{ matrix.expected_platform }}',arch:'${{ matrix.expected_arch }}'}; const observed={platform:process.platform,arch:process.arch}; console.log(JSON.stringify({expected,observed})); if(observed.platform!==expected.platform||observed.arch!==expected.arch){console.error('Runner OS/architecture mismatch.');process.exit(1)}"

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane ${{ matrix.runtime_lane }}

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane ${{ matrix.runtime_lane }}

      - name: Validate CI dependency lock alignment
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run ci:dependency-locks:check

      - name: Install root native-toolchain dependencies without lifecycle scripts
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        id: install_1
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Run Node native toolchain smoke
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        if: ${{ !cancelled() && steps.install_1.outcome == 'success' }}
        run: npm run test:node-native-toolchain

      - name: Upload Node native toolchain smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-node-native-toolchain-smoke-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-node-native-toolchain-smoke.json
          if-no-files-found: error

  xtend-mcp-vscode-smoke:
    name: XTend MCP VSIX smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure npm download cache
        run: node scripts/configure_npm_cache.js

      - name: Restore npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xtend-npm-cache
          key: xtend-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'products/xtend-llm/package-lock.json', 'products/resumability-maraca-erp-demo/package-lock.json') }}

      - name: Setup Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane node-24-lts

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane node-24-lts

      - name: Validate CI dependency lock alignment
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run ci:dependency-locks:check

      - name: Install workspace dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        id: install_1
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Build hash-checked VSIX
        id: build_vsix
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run build:rmt-editor:vscode

      - name: Start bundled read-only and write-opt-in servers
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        if: ${{ !cancelled() && steps.install_1.outcome == 'success' && steps.build_vsix.outcome == 'success' }}
        run: npm run test:xtend-mcp-vsix-smoke

      - name: Upload VSIX smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-mcp-vsix-${{ matrix.os }}
          path: |
            tools/rmt-editor/vscode/xtend-rmt-language-0.1.0-rc.1.vsix
            .xtend-test-results/runtime/xtend-node-runtime-node-24-lts.json
            .xtend-test-results/runtime/xtend-node-warnings-node-24-lts.jsonl
            .xtend-test-results/xtend-mcp-vsix-smoke.json
            .xtend-test-results/xtend-rmt-editor-vsix-smoke.json
          if-no-files-found: error

  laravel-release-gates:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true
    uses: ./.github/workflows/xtend-laravel-ssr.yml

  npm-publish-latest:
    name: Publish npm latest with provenance (Node 24.18.0)
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true
    needs:
      - full-release-gates
      - rmt-vnext-primitive-gates
      - package-structure
      - conditional-network-evidence
      - node-native-toolchain-smoke
      - xtend-mcp-vscode-smoke
      - laravel-release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure npm download cache
        run: node scripts/configure_npm_cache.js

      - name: Restore npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xtend-npm-cache
          key: xtend-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'products/xtend-llm/package-lock.json', 'products/resumability-maraca-erp-demo/package-lock.json') }}

      - name: Setup Node.js 24.18.0 for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
          scope: '@ccslabs'

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane node-24-publish

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane node-24-publish

      - name: Print runtime versions
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          node --version
          npm --version

      - name: Validate CI dependency lock alignment
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run ci:dependency-locks:check

      - name: Install workspace links for release evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        id: install_1
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Install XTend LLM CI catfood dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        id: install_2
        run: npm ci --prefix products/xtend-llm --ignore-scripts --no-audit --fund=false

      - name: Install ERP resumability catfood dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        id: install_erp
        run: npm ci --prefix products/resumability-maraca-erp-demo --ignore-scripts --no-audit --fund=false

      - name: Re-run blocking release evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_CONDITIONAL_NETWORK_EXECUTE: "1"
          XTEND_CONDITIONAL_NETWORK_ALLOW_DEFERRAL: "0"
        if: ${{ !cancelled() && steps.install_1.outcome == 'success' && steps.install_2.outcome == 'success' && steps.install_erp.outcome == 'success' }}
        run: |
          npm run native-first:evidence:prepare
          npm run test:ci-publish
          npm run test:xtend-mcp:report
          npm run pack:dry-run
          npm run conditional-network:evidence

      - name: Final npm publish dry run
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --dry-run --workspace @ccslabs/xtend-rmt --tag latest --access public
          npm publish --dry-run --workspace @ccslabs/xtend-compiler --tag latest --access public
          npm publish --dry-run --workspace @ccslabs/xtend-maraca --tag latest --access public
          npm publish --dry-run --workspace @ccslabs/xtend-mcp --tag latest --access public
          npm publish --dry-run --tag latest --access public

      - name: Publish XTend MCP runtime dependency train
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace @ccslabs/xtend-rmt --tag latest --provenance --access public
          npm publish --workspace @ccslabs/xtend-compiler --tag latest --provenance --access public
          npm publish --workspace @ccslabs/xtend-maraca --tag latest --provenance --access public

      - name: Publish root package to npm latest
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest --provenance --access public

      - name: Publish XTend MCP 0.1 to npm latest
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @ccslabs/xtend-mcp --tag latest --provenance --access public

      - name: Upload npm publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-npm-publish-latest-evidence-node-24-18-0
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-node-24-publish.json
            .xtend-test-results/runtime/xtend-node-warnings-node-24-publish.jsonl
            .xtend-test-results/xtend-release-gate-report.json
            .xtend-test-results/xtend-mcp-gate-report.json
            .xtend-test-results/xtend-xtensions-framework-adapters-report.json
            .xtend-test-results/xtend-rmt-vnext-primitives-gate-report.json
            .xtend-test-results/xtend-native-first-rmt-owned-release-report.json
            .xtend-test-results/xtend-rkfa-production-closure-report.json
            .xtend-test-results/xtend-release-report.json
            .xtend-test-results/xtend-pack-dry-run.json
            .xtend-test-results/xtend-package-export-surface-lock.json
            .xtend-test-results/xtend-package-export-lock-report.json
            .xtend-test-results/xtend-npm-audit-report.json
            .xtend-test-results/xtend-npm-sbom.json
            .xtend-test-results/xtend-conditional-network-evidence-report.json
          if-no-files-found: warn
