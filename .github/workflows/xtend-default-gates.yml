          python3 - <<'PYCORE'
          import json,os
          e=os.environ
          expected=dict(profile='xtend.npm.core-only.v1',producerMode='committed',sourceSha=e['CORE_SHA'],archiveSha256=e['CORE_ARCHIVE_SHA256'],manifestSha256=e['CORE_MANIFEST_SHA256'],context=dict(runId=e['GITHUB_RUN_ID'],runAttempt=e['GITHUB_RUN_ATTEMPT']))
          destination=e['RUNNER_TEMP']+'/core-expected.json'
          with open(destination,'x') as output:json.dump(expected,output)
          with open(e['GITHUB_ENV'],'a') as output:output.write('XTEND_CORE_REQUIRED=true\nXTEND_CORE_ARCHIVE='+e['RUNNER_TEMP']+'/core-source/sources.tar.gz\nXTEND_CORE_EXPECTED='+destination+'\n')
          PYCORE
      - name: Require authenticated Core source and projection
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: node scripts/check-core-source.cjs
      - name: Configure pinned browser without changing sandbox or privilege settings
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: node scripts/prepare_product_browser_toolchain.cjs "${{ runner.temp }}/xtend-security-browser"
      - name: Check committed sanitizer and renderer hash mirrors
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          npm run check:html-sanitizer
          node xtend-maraca/sync-app-services-esm.js --check
          node xscaler/generate-esm.js --check
          node scripts/verify_xtendrmt_artifact_parity.js
          npm run ci:dependency-locks:check
      - name: Execute maintained real sanitizer and Trusted Types browser assertions without skips
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: node scripts/run_xtend_tests.js --profile core-security-browser --execution .xtend-test-results/core-security/security-execution.json
      - name: Retain exact raw Core security report on success or failure
        id: security
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xtend-core-security-node-24.18.0-attempt-${{ github.run_attempt }}
          path: .xtend-test-results/core-security/security-execution.json
          if-no-files-found: error

  release-seal:
    name: Bind all gates to the immutable release artifact
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true && needs.release-prepare.result == 'success' && needs.core-installed-consumers.result == 'success' && needs['core-security-browser'].result == 'success' }}
    needs:
      - core-source-artifact
      - release-prepare
      - full-release-gates
      - rmt-vnext-primitive-gates
      - package-structure
      - conditional-network-evidence
      - node-native-toolchain-smoke
      - xtend-mcp-vscode-smoke
      - laravel-release-gates
      - core-installed-consumers
      - core-security-browser
    outputs:
      artifactId: ${{ steps.final.outputs.artifactId }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        env:
          update: true
          use_package_cache: false
        with:
          php-version: 8.4
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, curl, zip
          tools: composer:2.10.3
      - name: Configure npm download cache
        run: node scripts/configure_npm_cache.js
      - name: Restore npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xtend-npm-cache
          key: xtend-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false
      - name: Discover and verify the installed npm CLI for plain Node steps
        run: node scripts/release/toolchain.cjs --execute
      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane node-24-publish
      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane node-24-publish
      - name: Install source verifier dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Acquire required same-run Core source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.core-source-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/core-source
      - name: Bind Core source expectation
        env:
          CORE_SHA: ${{ needs.core-source-artifact.outputs.core-sha }}
          CORE_ARCHIVE_SHA256: ${{ needs.core-source-artifact.outputs.archive-sha256 }}
          CORE_MANIFEST_SHA256: ${{ needs.core-source-artifact.outputs.manifest-sha256 }}
        run: |
          python3 - <<'PYCORE'
          import json,os
          e=os.environ
          expected=dict(profile='xtend.npm.core-only.v1',producerMode='committed',sourceSha=e['CORE_SHA'],archiveSha256=e['CORE_ARCHIVE_SHA256'],manifestSha256=e['CORE_MANIFEST_SHA256'],context=dict(runId=e['GITHUB_RUN_ID'],runAttempt=e['GITHUB_RUN_ATTEMPT']))
          destination=e['RUNNER_TEMP']+'/core-expected.json'
          with open(destination,'x') as output:json.dump(expected,output)
          with open(e['GITHUB_ENV'],'a') as output:output.write('XTEND_CORE_REQUIRED=true\nXTEND_CORE_ARCHIVE='+e['RUNNER_TEMP']+'/core-source/sources.tar.gz\nXTEND_CORE_EXPECTED='+destination+'\n')
          PYCORE
      - name: Download prepared exact bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.release-prepare.outputs.preparedArtifactId }}
          path: .xtend-test-results/core-candidates
      - name: Verify and seal both authenticated raw Core lanes; preserve original resume bytes
        id: seal
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          GITHUB_TOKEN: ${{ github.token }}
          XTEND_RELEASE_PUBLISH: ${{ inputs.publish_to_npm }}
          XTEND_RELEASE_NEEDS: ${{ toJSON(needs) }}
          XTEND_CORE_RESUME_EVIDENCE: ${{ github.workspace }}/.xtend-test-results/current-resume/core-evidence
          MANIFEST_INTEGRITY: ${{ needs.release-prepare.outputs.manifestIntegrity }}
          RESUME_ARTIFACT_ID: ${{ inputs.resume_artifact_id }}
        run: |
          resume=()
          if [[ -n "$RESUME_ARTIFACT_ID" ]]; then resume=(--resume --artifact-id "$RESUME_ARTIFACT_ID"); fi
          node scripts/release/pipeline.cjs seal --execute --artifact .xtend-test-results/core-candidates --manifest-integrity "$MANIFEST_INTEGRITY" "${resume[@]}"
      - name: Provision unchanged blocking publish browser runtime
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth unzip
          node scripts/prepare_product_browser_toolchain.cjs "${{ runner.temp }}/xtend-browser"
      - name: Run all existing blocking publish checks against the verified Core artifact
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_RELEASE_ARTIFACT: ${{ github.workspace }}/.xtend-test-results/core-candidates
          XTEND_RELEASE_MANIFEST_INTEGRITY: ${{ steps.seal.outputs.manifestIntegrity }}
          XTEND_CONDITIONAL_NETWORK_EXECUTE: '1'
          XTEND_CONDITIONAL_NETWORK_ALLOW_DEFERRAL: '0'
        run: |
          npm run native-first:evidence:prepare
          npm run test:ci-publish
          npm run test:xtend-mcp:report
          npm run pack:dry-run
          npm run conditional-network:evidence
      - name: Upload immutable sealed release artifact
        if: inputs.resume_artifact_id == ''
        id: sealed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xtend-release-sealed
          path: .xtend-test-results/core-candidates/
          include-hidden-files: true
          if-no-files-found: error
      - name: Identify the immutable original artifact
        id: final
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          NEW_ARTIFACT_ID: ${{ steps.sealed.outputs.artifact-id }}
          RESUME_ARTIFACT_ID: ${{ inputs.resume_artifact_id }}
        run: printf 'artifactId=%s\n' "${RESUME_ARTIFACT_ID:-$NEW_ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
      - name: Preserve fresh seal gate evidence after success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xtend-release-seal-evidence-${{ github.run_attempt }}
          path: .xtend-test-results/
          include-hidden-files: true
          if-no-files-found: warn
