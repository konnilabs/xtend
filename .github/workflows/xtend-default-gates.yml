          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure npm download cache
        run: node scripts/configure_npm_cache.js

      - name: Restore npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xtend-npm-cache
          key: xtend-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane node-24-lts

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane node-24-lts

      - name: Validate CI dependency lock alignment
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run ci:dependency-locks:check

      - name: Install workspace dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        id: install_1
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Build hash-checked VSIX
        id: build_vsix
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run build:rmt-editor:vscode

      - name: Start bundled read-only and write-opt-in servers
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        if: ${{ !cancelled() && steps.install_1.outcome == 'success' && steps.build_vsix.outcome == 'success' }}
        run: npm run test:xtend-mcp-vsix-smoke

      - name: Upload VSIX smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-mcp-vsix-${{ matrix.os }}
          path: |
            tools/rmt-editor/vscode/xtend-rmt-language-0.1.0-rc.1.vsix
            .xtend-test-results/runtime/xtend-node-runtime-node-24-lts.json
            .xtend-test-results/runtime/xtend-node-warnings-node-24-lts.jsonl
            .xtend-test-results/xtend-mcp-vsix-smoke.json
            .xtend-test-results/xtend-rmt-editor-vsix-smoke.json
          if-no-files-found: error

  laravel-release-gates:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true
    uses: ./.github/workflows/xtend-laravel-ssr.yml

  npm-publish-latest:
    name: Publish npm latest with provenance (Node 24.18.0)
    # pr-fast-gates is a deliberately skipped ancestor on manual release runs.
    # Override implicit success(), but require every direct release gate to pass.
    if: >-
      ${{ !cancelled() &&
          github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true &&
          github.repository == 'konnilabs/xtend' && github.ref == 'refs/heads/main' &&
          needs['release-seal'].result == 'success' &&
          needs['full-release-gates'].result == 'success' &&
          needs['rmt-vnext-primitive-gates'].result == 'success' &&
          needs['package-structure'].result == 'success' &&
          needs['conditional-network-evidence'].result == 'success' &&
          needs['node-native-toolchain-smoke'].result == 'success' &&
          needs['xtend-mcp-vscode-smoke'].result == 'success' &&
          needs['laravel-release-gates'].result == 'success' &&
          needs['core-installed-consumers'].result == 'success' && needs['core-security-browser'].result == 'success' && needs['core-source-artifact'].result == 'success' }}
    needs:
      - full-release-gates
      - rmt-vnext-primitive-gates
      - package-structure
      - conditional-network-evidence
      - node-native-toolchain-smoke
      - xtend-mcp-vscode-smoke
      - laravel-release-gates
      - core-installed-consumers
      - core-security-browser
      - core-source-artifact
      - release-prepare
      - release-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize always-on release attempt ledger
        env:
          RELEASE_ARTIFACT_ID: ${{ needs.release-seal.outputs.artifactId }}
        run: node scripts/release/attempt.cjs init --execute
      - name: Configure npm download cache
        run: node scripts/configure_npm_cache.js
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
          scope: '@ccslabs'
      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false
      - name: Discover and verify the installed npm CLI for plain Node steps
        run: node scripts/release/toolchain.cjs --execute
      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane node-24-publish
      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane node-24-publish
      - name: Validate CI dependency lock alignment
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run ci:dependency-locks:check
      - name: Install verifier dependencies without lifecycle scripts
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Download and recheck exact immutable release artifact
        id: artifact
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.release-seal.outputs.artifactId }}
        run: node scripts/release/pipeline.cjs download --execute --artifact .xtend-test-results/npm-release --artifact-id "$RELEASE_ARTIFACT_ID"
      - name: Publish exact verified tarballs sequentially with registry rechecks
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_RELEASE_PUBLISH: ${{ inputs.publish_to_npm }}
          XTEND_RELEASE_ENVIRONMENT: npm-publish
          XTEND_RELEASE_ARTIFACT_ID: ${{ needs.release-seal.outputs.artifactId }}
          XTEND_RELEASE_NEEDS: ${{ toJSON(needs) }}
          MANIFEST_INTEGRITY: ${{ steps.artifact.outputs.manifestIntegrity }}
        run: >-
          node scripts/release/cli.cjs publish --execute
          --artifact .xtend-test-results/npm-release
          --manifest-integrity "$MANIFEST_INTEGRITY" --source-sha "$GITHUB_SHA"
          --ledger .xtend-test-results/npm-release-ledger.json
      - name: Finalize always-on attempt ledger
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: node scripts/release/attempt.cjs finish --execute --outcome "$JOB_STATUS"
      - name: Preserve release result ledger after success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xtend-npm-release-ledger-${{ github.run_attempt }}
          path: |
            .xtend-test-results/npm-release-ledger.json
            .xtend-test-results/npm-release-attempt.json
            .xtend-test-results/runtime/
          if-no-files-found: warn

  core-installed-consumers:
    needs: [core-source-artifact, release-prepare]
    name: Core installed consumer (Node ${{ matrix.node_version }})
    strategy:
      fail-fast: false
      matrix:
        node_version: [24.18.0, 26.5.0]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false
      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false
      - name: Discover and verify npm CLI
        run: node scripts/release/toolchain.cjs --execute
      - name: Capture runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane core-${{ matrix.node_version }}
      - name: Enable warning policy
        run: node scripts/enable_node_warning_policy.js --lane core-${{ matrix.node_version }}
      - name: Install verified Core test dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Acquire required same-run Core source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.core-source-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/core-source
      - name: Bind Core source expectation
        env:
          CORE_SHA: ${{ needs.core-source-artifact.outputs.core-sha }}
          CORE_ARCHIVE_SHA256: ${{ needs.core-source-artifact.outputs.archive-sha256 }}
          CORE_MANIFEST_SHA256: ${{ needs.core-source-artifact.outputs.manifest-sha256 }}
        run: |
          python3 - <<'PYCORE'
          import json,os
          e=os.environ
          expected=dict(profile='xtend.npm.core-only.v1',producerMode='committed',sourceSha=e['CORE_SHA'],archiveSha256=e['CORE_ARCHIVE_SHA256'],manifestSha256=e['CORE_MANIFEST_SHA256'],context=dict(runId=e['GITHUB_RUN_ID'],runAttempt=e['GITHUB_RUN_ATTEMPT']))
          destination=e['RUNNER_TEMP']+'/core-expected.json'
          with open(destination,'x') as output:json.dump(expected,output)
          with open(e['GITHUB_ENV'],'a') as output:output.write('XTEND_CORE_REQUIRED=true\nXTEND_CORE_ARCHIVE='+e['RUNNER_TEMP']+'/core-source/sources.tar.gz\nXTEND_CORE_EXPECTED='+destination+'\n')
          PYCORE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.release-prepare.outputs.preparedArtifactId }}
          path: .xtend-test-results/core-candidates
      - name: Consume exact archives and preserve raw Core evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          CANDIDATE_SHA256: ${{ needs.release-prepare.outputs.candidateSha256 }}
          MANIFEST_INTEGRITY: ${{ needs.release-prepare.outputs.manifestIntegrity }}
        run: node scripts/release/pipeline.cjs consumers --execute --artifact .xtend-test-results/core-candidates --candidate-sha256 "$CANDIDATE_SHA256" --manifest-integrity "$MANIFEST_INTEGRITY" --output .xtend-test-results/core-lane
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: xtend-core-consumer-node-${{ matrix.node_version }}-attempt-${{ github.run_attempt }}
          path: .xtend-test-results/core-lane/
          if-no-files-found: error

  release-prepare:
    needs: core-source-artifact
    name: Build and pack exact Core release candidates once
    timeout-minutes: 60
    outputs:
      manifestIntegrity: ${{ steps.prepare.outputs.manifestIntegrity }}
      candidateSha256: ${{ steps.prepare.outputs.candidateSha256 }}
      artifactId: ${{ steps.prepare.outputs.artifactId }}
      preparedArtifactId: ${{ steps.prepared.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        env:
          update: true
          use_package_cache: false
        with:
          php-version: 8.4
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, curl, zip
          tools: composer:2.10.3
      - name: Configure npm download cache
        run: node scripts/configure_npm_cache.js
      - name: Restore npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xtend-npm-cache
          key: xtend-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false
      - name: Discover and verify the installed npm CLI for plain Node steps
        run: node scripts/release/toolchain.cjs --execute
      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane node-24-publish
      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane node-24-publish
      - name: Install source verifier dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Acquire required same-run Core source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.core-source-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/core-source
      - name: Bind Core source expectation
        env:
          CORE_SHA: ${{ needs.core-source-artifact.outputs.core-sha }}
          CORE_ARCHIVE_SHA256: ${{ needs.core-source-artifact.outputs.archive-sha256 }}
          CORE_MANIFEST_SHA256: ${{ needs.core-source-artifact.outputs.manifest-sha256 }}
        run: |
          python3 - <<'PYCORE'
          import json,os
          e=os.environ
          expected=dict(profile='xtend.npm.core-only.v1',producerMode='committed',sourceSha=e['CORE_SHA'],archiveSha256=e['CORE_ARCHIVE_SHA256'],manifestSha256=e['CORE_MANIFEST_SHA256'],context=dict(runId=e['GITHUB_RUN_ID'],runAttempt=e['GITHUB_RUN_ATTEMPT']))
          destination=e['RUNNER_TEMP']+'/core-expected.json'
          with open(destination,'x') as output:json.dump(expected,output)
          with open(e['GITHUB_ENV'],'a') as output:output.write('XTEND_CORE_REQUIRED=true\nXTEND_CORE_ARCHIVE='+e['RUNNER_TEMP']+'/core-source/sources.tar.gz\nXTEND_CORE_EXPECTED='+destination+'\n')
          PYCORE
      - name: Prepare once or resume the immutable reviewed artifact
        id: prepare
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GROUPS: ${{ inputs.release_groups }}
          RELEASE_PACKAGES: ${{ inputs.release_packages }}
          RESUME_ARTIFACT_ID: ${{ inputs.resume_artifact_id }}
        run: |
          scope=()
          if [[ -n "$RELEASE_GROUPS" ]]; then scope+=(--groups "$RELEASE_GROUPS"); fi
          if [[ -n "$RELEASE_PACKAGES" ]]; then scope+=(--packages "$RELEASE_PACKAGES"); fi
          if [[ -n "$RESUME_ARTIFACT_ID" ]]; then
            node scripts/release/pipeline.cjs download --execute --artifact .xtend-test-results/core-candidates --artifact-id "$RESUME_ARTIFACT_ID" "${scope[@]}"
          else
            node scripts/release/pipeline.cjs prepare --execute --artifact .xtend-test-results/core-candidates "${scope[@]}"
          fi
      - name: Upload exact prepared candidates for both consumer lanes
        id: prepared
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xtend-release-prepared
          path: .xtend-test-results/core-candidates/
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve preparation gate evidence on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xtend-release-preparation-evidence
          path: .xtend-test-results/
          include-hidden-files: true
          if-no-files-found: warn

