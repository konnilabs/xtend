name: XTend CI Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: 'Publish @ccslabs/xtend to npm with the latest dist-tag after all release gates pass.'
        required: false
        default: false
        type: boolean
      run_source_to_sea:
        description: 'Run the optional RMT vNext Source-to-Sea browser evidence job.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xtend-ci-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-fast-gates:
    name: PR fast gates (Node 26.x)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Run XTend PR fast gate report
        run: npm run test:pr:report

      - name: Run RMT Reference docs report
        run: npm run test:rmt-reference-docs:report

      - name: Run docs stub inventory report
        if: always()
        continue-on-error: true
        run: npm run test:docs-stub-inventory:report

      - name: Upload XTend PR JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-pr-gate-report-node-26
          path: |
            .xtend-test-results/xtend-pr-gate-report.json
            .xtend-test-results/xtend-rmt-reference-docs-report.json
            .xtend-test-results/xtend-docs-stub-inventory-report.json
          if-no-files-found: warn

  full-release-gates:
    name: Full release gates (Node 26.x)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Prepare Native-First release evidence artifacts
        run: npm run native-first:evidence:prepare

      - name: Run XTend full release gate report
        run: npm run test:release:full:report

      - name: Run RMT Reference docs report
        run: npm run test:rmt-reference-docs:report

      - name: Run docs stub inventory report
        if: always()
        continue-on-error: true
        run: npm run test:docs-stub-inventory:report

      - name: Upload XTend full JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-release-gate-report-node-26
          path: |
            .xtend-test-results/xtend-release-gate-report.json
            .xtend-test-results/xtend-rmt-reference-docs-report.json
            .xtend-test-results/xtend-docs-stub-inventory-report.json
          if-no-files-found: warn

  rmt-vnext-primitive-gates:
    name: RMT vNext and Native-First RMT Owned gates (Node 26.x)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Run RMT vNext primitive gate report
        run: npm run test:rmt-vnext-primitives:report

      - name: Prepare Native-First release evidence artifacts
        run: npm run native-first:evidence:prepare

      - name: Run Native-First and RMT Owned release report
        run: npm run test:native-first-rmt-owned-release:report

      - name: Capture RMT vNext source-to-sea browser evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        run: |
          mkdir -p .xtend-test-results
          set +e
          npm run test:rmt-vnext-source-to-sea:chromedriver
          status=$?
          printf "%s\n" "$status" > .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode
          exit 0
        env:
          RMT_VNEXT_SOURCE_TO_SEA_BROWSER_NAME: chrome
          RMT_VNEXT_SOURCE_TO_SEA_WEBDRIVER_PORT: "9515"

      - name: Ensure RMT vNext source-to-sea evidence artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        run: |
          mkdir -p .xtend-test-results
          if [ ! -f .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json ]; then
            node -e "const fs=require('fs'); const path='.xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json'; const report={schema:'xtend.rmt.vnext.source-to-sea-evidence-report.v1',workpackage:'RMT-VNEXT-PRIM-06',ok:false,status:'failed',source:null,browserFixture:null,resultKey:'__xtendRmtVNextSourceToSeaResult',artifact:{path, browserExecutionRequired:true,browserExecutionStatus:'failed'},evidence:null,objectMatrix:null,browserExecution:{schema:'xtend.rmt.vnext.browser-execution-evidence.v1',workpackage:'RMT-VNEXT-PRIM-06',resultKey:'__xtendRmtVNextSourceToSeaResult',driver:'chromedriver',required:true,ok:false,status:'failed',mode:'missing-artifact-fallback',reason:'Capture RMT vNext source-to-sea browser evidence did not create an artifact before exiting.',checks:[{name:'source-to-sea evidence artifact was created by capture step',ok:false,detail:path}]},checks:[{name:'source-to-sea evidence artifact was created by capture step',ok:false,detail:path}]}; fs.writeFileSync(path, JSON.stringify(report,null,2)+'\n');"
          fi

      - name: Upload RMT vNext primitive JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-rmt-vnext-primitives-gate-report-node-26
          path: .xtend-test-results/xtend-rmt-vnext-primitives-gate-report.json
          if-no-files-found: warn

      - name: Upload Native-First RMT Owned release JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-native-first-rmt-owned-release-report-node-26
          path: .xtend-test-results/xtend-native-first-rmt-owned-release-report.json
          if-no-files-found: warn

      - name: Upload RMT vNext source-to-sea evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        uses: actions/upload-artifact@v6
        with:
          name: xtend-rmt-vnext-source-to-sea-evidence-node-26
          path: .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json
          if-no-files-found: error

      - name: Validate RMT vNext source-to-sea evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        run: npm run test:rmt-vnext-source-to-sea:validate-artifact

  package-structure:
    name: Package structure dry runs (Node 26.x)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_CACHE: .xtend-test-results/npm-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Validate root package dry run
        run: |
          mkdir -p .xtend-test-results
          npm run pack:dry-run

      - name: Validate workspace package dry runs
        run: |
          npm pack --workspace xtendrmt --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xtendrmt.json
          npm pack --workspace fabric --dry-run --json > .xtend-test-results/xtend-pack-dry-run-fabric.json
          npm pack --workspace tools --dry-run --json > .xtend-test-results/xtend-pack-dry-run-tools.json
          npm pack --workspace xtend-builder --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xtend-builder.json
          npm pack --workspace xtend-maraca --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xtend-maraca.json

      - name: Upload package structure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-package-structure-node-26
          path: |
            .xtend-test-results/xtend-pack-dry-run.json
            .xtend-test-results/xtend-package-export-surface-lock.json
            .xtend-test-results/xtend-package-export-lock-report.json
            .xtend-test-results/xtend-pack-dry-run-xtendrmt.json
            .xtend-test-results/xtend-pack-dry-run-fabric.json
            .xtend-test-results/xtend-pack-dry-run-tools.json
            .xtend-test-results/xtend-pack-dry-run-xtend-builder.json
            .xtend-test-results/xtend-pack-dry-run-xtend-maraca.json
          if-no-files-found: warn

  conditional-network-evidence:
    name: Conditional network evidence (Node 26.x)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install workspace links for npm SBOM
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Capture conditional network evidence
        env:
          XTEND_CONDITIONAL_NETWORK_EXECUTE: "1"
          XTEND_CONDITIONAL_NETWORK_USE_NPX_NPM10: "1"
        run: npm run conditional-network:evidence

      - name: Upload conditional network evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-conditional-network-evidence-node-26
          path: |
            .xtend-test-results/xtend-npm-audit-report.json
            .xtend-test-results/xtend-npm-sbom.json
            .xtend-test-results/xtend-conditional-network-evidence-report.json
          if-no-files-found: warn

  npm-publish-latest:
    name: Publish npm latest with provenance (Node 26.x)
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true)
    needs:
      - full-release-gates
      - rmt-vnext-primitive-gates
      - package-structure
      - conditional-network-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x for npm
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
          scope: '@ccslabs'

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install workspace links for release evidence
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Re-run blocking release evidence
        env:
          XTEND_CONDITIONAL_NETWORK_EXECUTE: "1"
          XTEND_CONDITIONAL_NETWORK_ALLOW_DEFERRAL: "0"
          XTEND_CONDITIONAL_NETWORK_USE_NPX_NPM10: "1"
        run: |
          npm run native-first:evidence:prepare
          npm run test:release:full:report
          npm run test:rmt-vnext-primitives:report
          npm run test:native-first-rmt-owned-release:report
          npm run release:report
          npm run pack:dry-run
          npm run conditional-network:evidence

      - name: Final npm publish dry run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --dry-run --tag latest --access public

      - name: Publish root package to npm latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest --provenance --access public

      - name: Upload npm publish evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-npm-publish-latest-evidence-node-26
          path: |
            .xtend-test-results/xtend-release-gate-report.json
            .xtend-test-results/xtend-rmt-vnext-primitives-gate-report.json
            .xtend-test-results/xtend-native-first-rmt-owned-release-report.json
            .xtend-test-results/xtend-release-report.json
            .xtend-test-results/xtend-pack-dry-run.json
            .xtend-test-results/xtend-package-export-surface-lock.json
            .xtend-test-results/xtend-package-export-lock-report.json
            .xtend-test-results/xtend-npm-audit-report.json
            .xtend-test-results/xtend-npm-sbom.json
            .xtend-test-results/xtend-conditional-network-evidence-report.json
          if-no-files-found: warn
