  rmt-vnext-primitive-gates:
    needs: [pr-fast-gates, full-release-gates]
    if: ${{ always() && !cancelled() }}
    name: RMT vNext and Native-First RMT Owned gates (Node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: node-24-18-0
          - node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: node-26-5-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure npm download cache
        run: node scripts/configure_npm_cache.js

      - name: Restore npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xtend-npm-cache
          key: xtend-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'products/xtend-llm/package-lock.json', 'products/resumability-maraca-erp-demo/package-lock.json') }}

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane ${{ matrix.runtime_lane }}

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane ${{ matrix.runtime_lane }}

      - name: Print runtime versions
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          node --version
          npm --version

      - name: Validate CI dependency lock alignment
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run ci:dependency-locks:check

      - name: Download same-run shared XTend execution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: xtend-shared-execution-${{ matrix.runtime_lane }}
          path: .xtend-test-results

      - name: Run RMT vNext primitive gate report
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: node scripts/run_xtend_tests.js --verify rmt-vnext-primitives --from .xtend-test-results/xtend-test-execution.json

      - name: Run Native-First and RMT Owned release report
        if: always()
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: node scripts/run_xtend_tests.js --verify native-first-rmt-owned-release --from .xtend-test-results/xtend-test-execution.json

      - name: Capture RMT vNext source-to-sea browser evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        run: |
          mkdir -p .xtend-test-results
          rm -f .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json
          set +e
          npm run test:rmt-vnext-source-to-sea:chromium
          status=$?
          set -e
          printf "%s\n" "$status" > .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode
          exit "$status"
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_BROWSER_HYPERVISOR_ENGINE: chromium

      - name: Ensure RMT vNext source-to-sea evidence artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          mkdir -p .xtend-test-results
          capture_status="$(cat .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode 2>/dev/null || printf 'missing')"
          if [ "$capture_status" != "0" ] || [ ! -f .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json ]; then
            CAPTURE_STATUS="$capture_status" node -e "const fs=require('fs'); const path='.xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json'; const captureStatus=process.env.CAPTURE_STATUS || 'missing'; const report={schema:'xtend.rmt.vnext.source-to-sea-evidence-report.v1',workpackage:'RMT-VNEXT-PRIM-06',ok:false,status:'failed',source:null,browserFixture:null,resultKey:'__xtendRmtVNextSourceToSeaResult',artifact:{path, browserExecutionRequired:true,browserExecutionStatus:'failed'},evidence:null,objectMatrix:null,browserExecution:{schema:'xtend.rmt.vnext.browser-execution-evidence.v1',workpackage:'RMT-VNEXT-PRIM-06',resultKey:'__xtendRmtVNextSourceToSeaResult',driver:'chromium',required:true,ok:false,status:'failed',mode:'capture-failed-fallback',reason:'Capture RMT vNext source-to-sea browser evidence failed or did not create a fresh artifact.',captureExitCode:captureStatus,checks:[{name:'source-to-sea capture command exited successfully',ok:false,detail:captureStatus},{name:'source-to-sea evidence artifact was created by successful capture step',ok:false,detail:path}]},checks:[{name:'source-to-sea capture command exited successfully',ok:false,detail:captureStatus},{name:'source-to-sea evidence artifact was created by successful capture step',ok:false,detail:path}]}; fs.writeFileSync(path, JSON.stringify(report,null,2)+'\n');"
          fi

      - name: Upload RMT vNext primitive JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-rmt-vnext-primitives-gate-report-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-rmt-vnext-primitives-gate-report.json
          if-no-files-found: warn

      - name: Upload Native-First RMT Owned release JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-native-first-rmt-owned-release-report-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-native-first-rmt-owned-release-report.json
          if-no-files-found: warn

      - name: Upload RMT vNext source-to-sea evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-rmt-vnext-source-to-sea-evidence-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json
          if-no-files-found: error

      - name: Validate RMT vNext source-to-sea evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rmt-vnext-source-to-sea:validate-artifact

