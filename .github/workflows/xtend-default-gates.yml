      - name: Run RMT vNext primitive gate report
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rmt-vnext-primitives:report

      - name: Prepare Native-First release evidence artifacts
        if: always()
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run native-first:evidence:prepare

      - name: Run Native-First and RMT Owned release report
        if: always()
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:native-first-rmt-owned-release:report

      - name: Capture RMT vNext source-to-sea browser evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        run: |
          mkdir -p .xtend-test-results
          rm -f .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json
          set +e
          npm run test:rmt-vnext-source-to-sea:chromedriver
          status=$?
          set -e
          printf "%s\n" "$status" > .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode
          exit "$status"
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          RMT_VNEXT_SOURCE_TO_SEA_BROWSER_NAME: chrome
          RMT_VNEXT_SOURCE_TO_SEA_WEBDRIVER_PORT: "9515"

      - name: Ensure RMT vNext source-to-sea evidence artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          mkdir -p .xtend-test-results
          capture_status="$(cat .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode 2>/dev/null || printf 'missing')"
          if [ "$capture_status" != "0" ] || [ ! -f .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json ]; then
            CAPTURE_STATUS="$capture_status" node -e "const fs=require('fs'); const path='.xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json'; const captureStatus=process.env.CAPTURE_STATUS || 'missing'; const report={schema:'xtend.rmt.vnext.source-to-sea-evidence-report.v1',workpackage:'RMT-VNEXT-PRIM-06',ok:false,status:'failed',source:null,browserFixture:null,resultKey:'__xtendRmtVNextSourceToSeaResult',artifact:{path, browserExecutionRequired:true,browserExecutionStatus:'failed'},evidence:null,objectMatrix:null,browserExecution:{schema:'xtend.rmt.vnext.browser-execution-evidence.v1',workpackage:'RMT-VNEXT-PRIM-06',resultKey:'__xtendRmtVNextSourceToSeaResult',driver:'chromedriver',required:true,ok:false,status:'failed',mode:'capture-failed-fallback',reason:'Capture RMT vNext source-to-sea browser evidence failed or did not create a fresh artifact.',captureExitCode:captureStatus,checks:[{name:'source-to-sea capture command exited successfully',ok:false,detail:captureStatus},{name:'source-to-sea evidence artifact was created by successful capture step',ok:false,detail:path}]},checks:[{name:'source-to-sea capture command exited successfully',ok:false,detail:captureStatus},{name:'source-to-sea evidence artifact was created by successful capture step',ok:false,detail:path}]}; fs.writeFileSync(path, JSON.stringify(report,null,2)+'\n');"
          fi

      - name: Upload RMT vNext primitive JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-rmt-vnext-primitives-gate-report-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-rmt-vnext-primitives-gate-report.json
          if-no-files-found: warn

      - name: Upload Native-First RMT Owned release JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-native-first-rmt-owned-release-report-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-native-first-rmt-owned-release-report.json
          if-no-files-found: warn

      - name: Upload RMT vNext source-to-sea evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-rmt-vnext-source-to-sea-evidence-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json
          if-no-files-found: error

      - name: Validate RMT vNext source-to-sea evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rmt-vnext-source-to-sea:validate-artifact

  package-structure:
    name: Package structure dry runs (Node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_CACHE: .xtend-test-results/npm-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: node-24-18-0
          - node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: node-26-5-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane ${{ matrix.runtime_lane }}

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane ${{ matrix.runtime_lane }}

      - name: Print runtime versions
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          node --version
          npm --version

      - name: Validate root package dry run
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          mkdir -p .xtend-test-results
          npm run pack:dry-run

      - name: Validate workspace package dry runs
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          npm pack --workspace xtendrmt --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xtendrmt.json
          npm pack --workspace fabric --dry-run --json > .xtend-test-results/xtend-pack-dry-run-fabric.json
          npm pack --workspace tools --dry-run --json > .xtend-test-results/xtend-pack-dry-run-tools.json
          npm pack --workspace xtend-builder --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xtend-builder.json
          npm pack --workspace xtend-maraca --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xtend-maraca.json
          npm pack --workspace xsurface-shard --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xsurface-shard.json

      - name: Upload package structure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-package-structure-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-pack-dry-run.json
            .xtend-test-results/xtend-package-export-surface-lock.json
            .xtend-test-results/xtend-package-export-lock-report.json
            .xtend-test-results/xtend-pack-dry-run-xtendrmt.json
            .xtend-test-results/xtend-pack-dry-run-fabric.json
            .xtend-test-results/xtend-pack-dry-run-tools.json
            .xtend-test-results/xtend-pack-dry-run-xtend-builder.json
            .xtend-test-results/xtend-pack-dry-run-xtend-maraca.json
            .xtend-test-results/xtend-pack-dry-run-xsurface-shard.json
          if-no-files-found: warn

  conditional-network-evidence:
    name: Conditional network evidence (Node ${{ matrix.node_version }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: node-24-18-0
          - node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: node-26-5-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane ${{ matrix.runtime_lane }}

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane ${{ matrix.runtime_lane }}

      - name: Print runtime versions
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          node --version
          npm --version

      - name: Install workspace links for npm SBOM
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Capture conditional network evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_CONDITIONAL_NETWORK_EXECUTE: "1"
        run: npm run conditional-network:evidence

      - name: Upload conditional network evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-conditional-network-evidence-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-npm-audit-report.json
            .xtend-test-results/xtend-npm-sbom.json
            .xtend-test-results/xtend-conditional-network-evidence-report.json
          if-no-files-found: warn

  node-native-toolchain-smoke:
    name: Node native toolchain smoke (${{ matrix.runner_label }}, Node ${{ matrix.node_version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            runner_label: ubuntu-24.04-x64
            expected_platform: linux
            expected_arch: x64
            node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: ubuntu-24-04-x64-node-24-18-0
          - runner: ubuntu-24.04
            runner_label: ubuntu-24.04-x64
            expected_platform: linux
            expected_arch: x64
            node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: ubuntu-24-04-x64-node-26-5-0
          - runner: windows-2025
            runner_label: windows-2025-x64
            expected_platform: win32
            expected_arch: x64
            node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: windows-2025-x64-node-24-18-0
          - runner: windows-2025
            runner_label: windows-2025-x64
            expected_platform: win32
            expected_arch: x64
            node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: windows-2025-x64-node-26-5-0
          - runner: macos-15
            runner_label: macos-15-arm64
            expected_platform: darwin
            expected_arch: arm64
            node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: macos-15-arm64-node-24-18-0
          - runner: macos-15
            runner_label: macos-15-arm64
            expected_platform: darwin
            expected_arch: arm64
            node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: macos-15-arm64-node-26-5-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          architecture: ${{ matrix.expected_arch }}
          package-manager-cache: false

      - name: Verify runner OS and architecture
        run: node -e "const expected={platform:'${{ matrix.expected_platform }}',arch:'${{ matrix.expected_arch }}'}; const observed={platform:process.platform,arch:process.arch}; console.log(JSON.stringify({expected,observed})); if(observed.platform!==expected.platform||observed.arch!==expected.arch){console.error('Runner OS/architecture mismatch.');process.exit(1)}"

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane ${{ matrix.runtime_lane }}

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane ${{ matrix.runtime_lane }}

      - name: Install root native-toolchain dependencies without lifecycle scripts
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Run Node native toolchain smoke
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:node-native-toolchain

      - name: Upload Node native toolchain smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-node-native-toolchain-smoke-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-node-native-toolchain-smoke.json
          if-no-files-found: error

  npm-publish-latest:
    name: Publish npm latest with provenance (Node 24.18.0)
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true
    needs:
      - full-release-gates
      - rmt-vnext-primitive-gates
      - package-structure
      - conditional-network-evidence
      - node-native-toolchain-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 24.18.0 for npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
          scope: '@ccslabs'

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane node-24-publish

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane node-24-publish

      - name: Print runtime versions
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          node --version
          npm --version

      - name: Install workspace links for release evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Install XTend LLM CI catfood dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --prefix products/xtend-llm --ignore-scripts --no-audit --fund=false

      - name: Re-run blocking release evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_CONDITIONAL_NETWORK_EXECUTE: "1"
          XTEND_CONDITIONAL_NETWORK_ALLOW_DEFERRAL: "0"
        run: |
          npm run native-first:evidence:prepare
          npm run test:release:full:report
          npm run test:feature-adoption-observatory
          npm run test:xtensions-framework-adapters:report
          npm run test:rmt-vnext-primitives:report
          npm run test:native-first-rmt-owned-release:report
          npm run test:rkfa-production-closure:report
          npm run release:report
          npm run pack:dry-run
          npm run conditional-network:evidence

      - name: Final npm publish dry run
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --dry-run --tag latest --access public

      - name: Publish root package to npm latest
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest --provenance --access public

      - name: Upload npm publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-npm-publish-latest-evidence-node-24-18-0
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-node-24-publish.json
            .xtend-test-results/runtime/xtend-node-warnings-node-24-publish.jsonl
            .xtend-test-results/xtend-release-gate-report.json
            .xtend-test-results/xtend-xtensions-framework-adapters-report.json
            .xtend-test-results/xtend-rmt-vnext-primitives-gate-report.json
            .xtend-test-results/xtend-native-first-rmt-owned-release-report.json
            .xtend-test-results/xtend-rkfa-production-closure-report.json
            .xtend-test-results/xtend-release-report.json
            .xtend-test-results/xtend-pack-dry-run.json
            .xtend-test-results/xtend-package-export-surface-lock.json
            .xtend-test-results/xtend-package-export-lock-report.json
            .xtend-test-results/xtend-npm-audit-report.json
            .xtend-test-results/xtend-npm-sbom.json
            .xtend-test-results/xtend-conditional-network-evidence-report.json
          if-no-files-found: warn
