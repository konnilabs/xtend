name: Materialize reviewed Nightly 131 fix
on:
  push:
    branches: [codex/nightly-131-materialize]
permissions:
  contents: write
jobs:
  apply-tested-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Pin repository npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false
      - name: Apply exact reviewed patch on its verified base
        env:
          PATCH_GZIP_BASE64: 
        run: |
          git checkout --detach 7db50f25ae4d65d4d6bdfa2516a68e2b898359bb
          node -e "process.stdout.write(require('node:zlib').gunzipSync(Buffer.from(process.env.PATCH_GZIP_BASE64,'base64')))" | git apply --index
          test "$(git write-tree)" = "139fa55a25ab7d67bac7ed5ab35e48e6b961acc7"
      - name: Install unchanged lockfile
        run: npm ci --no-audit --fund=false
      - name: Verify Observatory and regression checks
        run: |
          node scripts/run_xtend_tests.js --profile feature-adoption-observatory
          node scripts/run_xtend_tests.js test-runner
          git diff --check
          git diff --exit-code
          test "$(git write-tree)" = "139fa55a25ab7d67bac7ed5ab35e48e6b961acc7"
      - name: Publish only the tested fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: synchronize Observatory schema evidence and intake gate"
          git push origin HEAD:refs/heads/codex/nightly-130-observatory-schema-inventory
