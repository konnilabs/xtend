name: XTend Nightly Build

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      run_source_to_sea:
        description: 'Run optional RMT vNext Source-to-Sea browser evidence.'
        required: false
        default: false
        type: boolean
      run_conditional_network:
        description: 'Run optional audit/SBOM conditional network evidence.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xtend-nightly-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-build:
    name: Nightly build artifact bundle (Node ${{ matrix.node_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NPM_CONFIG_CACHE: .xtend-test-results/npm-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: node-24-18-0
          - node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: node-26-5-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane ${{ matrix.runtime_lane }}

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane ${{ matrix.runtime_lane }}

      - name: Print runtime versions
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          node --version
          npm --version

      - name: Install workspace dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Install XTend LLM CI catfood dependencies
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --prefix products/xtend-llm --ignore-scripts --no-audit --fund=false

      - name: Prepare nightly result directories
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: mkdir -p .xtend-test-results/nightly

      - name: Prepare Native-First release evidence artifacts
        id: native_first_evidence_prepare
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run native-first:evidence:prepare

      - name: Run XTend full release gate report
        id: full_release
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:release:full:report

      - name: Run XTend MCP contract, security, parity, and evidence gates
        id: xtend_mcp
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xtend-mcp:report

      - name: Run Feature Adoption Observatory gates
        id: feature_adoption_observatory
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:feature-adoption-observatory

      - name: Run RMT Reference docs report
        id: rmt_reference_docs
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rmt-reference-docs:report

      - name: Run XTendRMT demo structure report
        id: rmt_demos
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rmt-demos:report

      - name: Run RKFA production closure report
        id: rkfa_production_closure
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rkfa-production-closure:report

      - name: Run docs stub inventory report
        id: docs_stub_inventory
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:docs-stub-inventory:report

      - name: Run RMT vNext primitive gate report
        id: rmt_primitives
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rmt-vnext-primitives:report

      - name: Run Native-First and RMT Owned release report
        id: native_first_rmt_owned
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:native-first-rmt-owned-release:report

      - name: Capture release report evidence
        id: release_report
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run release:report

      - name: Validate root package dry run
        id: pack_root
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run pack:dry-run

      - name: Validate workspace package dry runs
        id: pack_workspaces
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          npm pack --workspace xtendrmt --dry-run --json --silent > .xtend-test-results/xtend-pack-dry-run-xtendrmt.json
          npm pack --workspace fabric --dry-run --json --silent > .xtend-test-results/xtend-pack-dry-run-fabric.json
          npm pack --workspace tools --dry-run --json --silent > .xtend-test-results/xtend-pack-dry-run-tools.json
          npm pack --workspace xtend-builder --dry-run --json --silent > .xtend-test-results/xtend-pack-dry-run-xtend-builder.json
          npm pack --workspace xtend-maraca --dry-run --json --silent > .xtend-test-results/xtend-pack-dry-run-xtend-maraca.json
          npm pack --workspace @ccslabs/xtend-mcp --dry-run --json --silent > .xtend-test-results/xtend-pack-dry-run-xtend-mcp.json
          npm pack --workspace xsurface-shard --dry-run --json --silent > .xtend-test-results/xtend-pack-dry-run-xsurface-shard.json

      - name: Run XTend Maraca gate report
        id: maraca
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:maraca:report

      - name: Run Maraca AppServices Node/PHP parity report
        id: maraca_app_services_cross_runtime
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:maraca-app-services-cross-runtime:report

      - name: Run XTend LLM AppServices catfood report
        id: xtend_llm_app_services_catfood
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xtend-llm-app-services-catfood:report

      - name: Run Maraca App Services Test Bench catfood report
        id: maraca_app_services_test_bench
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:maraca-app-services-test-bench:report

      - name: Run XTensions framework adapter report
        id: xtensions_framework_adapters
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xtensions-framework-adapters:report

      - name: Run XTend Dev Surface report
        id: xtend_dev_surface
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xtend-dev-surface:report

      - name: Run public docs quality report
        id: docs_quality
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:docs-quality:report

      - name: Run Docs Shell catfooding report
        id: docs_shell_catfooding
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:docs-shell-catfooding:report

      - name: Run Docs framework ownership report
        id: docs_framework_ownership
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:docs-framework-ownership:report

      - name: Run XSurface shard gate report
        id: xsurface_shard
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xsurface-shard:report

      - name: Run XScaler protocol gate report
        id: xscaler_protocol
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xscaler-protocol:report

      - name: Run XScaler public API gate report
        id: xscaler_public_api
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xscaler-public-api:report

      - name: Run XScaler JS/PHP preflight parity report
        id: xscaler_php_preflight_parity
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xscaler-php-preflight-parity:report

      - name: Run RMT Node/PHP XScaler SSR hydration parity report
        id: rmt_xscaler_ssr_hydration_parity
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rmt-xscaler-ssr-hydration-parity:report

      - name: Run XScaler source-to-sea gate report
        id: xscaler_source_to_sea
        continue-on-error: true
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:xscaler-source-to-sea:report

      - name: Create XTend nightly manifest
        if: always()
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run nightly:manifest

      - name: Upload XTend nightly artifact bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-nightly-build-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-release-gate-report.json
            .xtend-test-results/xtend-mcp-gate-report.json
            .xtend-test-results/xtend-rmt-reference-docs-report.json
            .xtend-test-results/xtend-rmt-demos-report.json
            .xtend-test-results/xtend-rkfa-production-closure-report.json
            .xtend-test-results/xtend-docs-stub-inventory-report.json
            .xtend-test-results/xtend-rmt-vnext-primitives-gate-report.json
            .xtend-test-results/xtend-native-first-rmt-owned-release-report.json
            .xtend-test-results/xtend-release-report.json
            .xtend-test-results/xtend-pack-dry-run.json
            .xtend-test-results/xtend-package-export-surface-lock.json
            .xtend-test-results/xtend-package-export-lock-report.json
            .xtend-test-results/xtend-pack-dry-run-xtendrmt.json
            .xtend-test-results/xtend-pack-dry-run-fabric.json
            .xtend-test-results/xtend-pack-dry-run-tools.json
            .xtend-test-results/xtend-pack-dry-run-xtend-builder.json
            .xtend-test-results/xtend-pack-dry-run-xtend-maraca.json
            .xtend-test-results/xtend-pack-dry-run-xtend-mcp.json
            .xtend-test-results/xtend-pack-dry-run-xsurface-shard.json
            .xtend-test-results/xtend-maraca-gate-report.json
            .xtend-test-results/xtend-maraca-app-services-cross-runtime-report.json
            .xtend-test-results/xtend-llm-app-services-catfood-report.json
            products/xtend-llm/.xtend-llm-results/app-services-catfood.json
            .xtend-test-results/xtend-maraca-app-services-test-bench-report.json
            products/maraca-app-services-test-bench/.xtend-test-results/maraca-app-services-test-bench-evidence.json
            products/maraca-app-services-test-bench/.xtend-test-results/maraca-app-services-test-bench.png
            .xtend-test-results/xtend-xtensions-framework-adapters-report.json
            .xtend-test-results/xtend-dev-surface-report.json
            .xtend-test-results/xtend-docs-quality-report.json
            .xtend-test-results/xtend-docs-shell-catfooding-report.json
            .xtend-test-results/xtend-docs-framework-ownership-report.json
            .xtend-test-results/xtend-xsurface-shard-report.json
            .xtend-test-results/xtend-xscaler-protocol-report.json
            .xtend-test-results/xtend-xscaler-public-api-report.json
            .xtend-test-results/xtend-xscaler-php-preflight-parity-report.json
            .xtend-test-results/xtend-rmt-xscaler-ssr-hydration-parity-report.json
            .xtend-test-results/xtend-xscaler-source-to-sea-report.json
            .xtend-build/maraca/source-to-sea/xtend.maraca.report.json
            .xtend-build/maraca/source-to-sea/xtend.maraca.size.json
            .xtend-test-results/xtend-nightly-build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail nightly build on required evidence failures
        if: always()
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          failed=0
          if [ "${{ steps.native_first_evidence_prepare.outcome }}" != "success" ]; then echo "Native-First evidence preparation failed"; failed=1; fi
          if [ "${{ steps.full_release.outcome }}" != "success" ]; then echo "full release gate failed"; failed=1; fi
          if [ "${{ steps.xtend_mcp.outcome }}" != "success" ]; then echo "XTend MCP gate failed"; failed=1; fi
          if [ "${{ steps.feature_adoption_observatory.outcome }}" != "success" ]; then echo "Feature Adoption Observatory gate failed"; failed=1; fi
          if [ "${{ steps.rmt_reference_docs.outcome }}" != "success" ]; then echo "RMT Reference docs gate failed"; failed=1; fi
          if [ "${{ steps.rmt_demos.outcome }}" != "success" ]; then echo "XTendRMT demo structure gate failed"; failed=1; fi
          if [ "${{ steps.rkfa_production_closure.outcome }}" != "success" ]; then echo "RKFA production closure gate failed"; failed=1; fi
          if [ "${{ steps.docs_stub_inventory.outcome }}" != "success" ]; then echo "docs stub inventory gate failed"; failed=1; fi
          if [ "${{ steps.rmt_primitives.outcome }}" != "success" ]; then echo "RMT vNext primitive gate failed"; failed=1; fi
          if [ "${{ steps.native_first_rmt_owned.outcome }}" != "success" ]; then echo "Native-First RMT Owned release gate failed"; failed=1; fi
          if [ "${{ steps.release_report.outcome }}" != "success" ]; then echo "release report failed"; failed=1; fi
          if [ "${{ steps.pack_root.outcome }}" != "success" ]; then echo "root package dry run failed"; failed=1; fi
          if [ "${{ steps.pack_workspaces.outcome }}" != "success" ]; then echo "workspace package dry runs failed"; failed=1; fi
          if [ "${{ steps.maraca.outcome }}" != "success" ]; then echo "Maraca gate failed"; failed=1; fi
          if [ "${{ steps.maraca_app_services_cross_runtime.outcome }}" != "success" ]; then echo "Maraca AppServices Node/PHP parity gate failed"; failed=1; fi
          if [ "${{ steps.xtend_llm_app_services_catfood.outcome }}" != "success" ]; then echo "XTend LLM AppServices catfood gate failed"; failed=1; fi
          if [ "${{ steps.maraca_app_services_test_bench.outcome }}" != "success" ]; then echo "Maraca App Services Test Bench catfood gate failed"; failed=1; fi
          if [ "${{ steps.xtensions_framework_adapters.outcome }}" != "success" ]; then echo "XTensions framework adapter gate failed"; failed=1; fi
          if [ "${{ steps.xtend_dev_surface.outcome }}" != "success" ]; then echo "XTend Dev Surface gate failed"; failed=1; fi
          if [ "${{ steps.docs_quality.outcome }}" != "success" ]; then echo "public docs quality gate failed"; failed=1; fi
          if [ "${{ steps.docs_shell_catfooding.outcome }}" != "success" ]; then echo "Docs Shell catfooding gate failed"; failed=1; fi
          if [ "${{ steps.docs_framework_ownership.outcome }}" != "success" ]; then echo "Docs framework ownership gate failed"; failed=1; fi
          if [ "${{ steps.xsurface_shard.outcome }}" != "success" ]; then echo "XSurface shard gate failed"; failed=1; fi
          if [ "${{ steps.xscaler_protocol.outcome }}" != "success" ]; then echo "XScaler protocol gate failed"; failed=1; fi
          if [ "${{ steps.xscaler_public_api.outcome }}" != "success" ]; then echo "XScaler public API gate failed"; failed=1; fi
          if [ "${{ steps.xscaler_php_preflight_parity.outcome }}" != "success" ]; then echo "XScaler JS/PHP preflight parity gate failed"; failed=1; fi
          if [ "${{ steps.rmt_xscaler_ssr_hydration_parity.outcome }}" != "success" ]; then echo "RMT Node/PHP XScaler SSR hydration parity gate failed"; failed=1; fi
          if [ "${{ steps.xscaler_source_to_sea.outcome }}" != "success" ]; then echo "XScaler source-to-sea gate failed"; failed=1; fi
          exit "$failed"

  optional-source-to-sea:
    name: Optional Source-to-Sea browser evidence (Node ${{ matrix.node_version }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: node-24-18-0
          - node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: node-26-5-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane ${{ matrix.runtime_lane }}

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane ${{ matrix.runtime_lane }}

      - name: Print runtime versions
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          node --version
          npm --version

      - name: Capture RMT vNext source-to-sea browser evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_BROWSER_HYPERVISOR_ENGINE: chromium
        run: |
          mkdir -p .xtend-test-results
          set +e
          npm run test:rmt-vnext-source-to-sea:chromium
          status=$?
          printf "%s\n" "$status" > .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode
          exit "$status"
      - name: Ensure RMT vNext source-to-sea evidence artifact
        if: always()
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          mkdir -p .xtend-test-results
          if [ ! -f .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json ]; then
            node -e "const fs=require('fs'); const path='.xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json'; const report={schema:'xtend.rmt.vnext.source-to-sea-evidence-report.v1',workpackage:'RMT-VNEXT-PRIM-06',ok:false,status:'failed',source:null,browserFixture:null,resultKey:'__xtendRmtVNextSourceToSeaResult',artifact:{path, browserExecutionRequired:true,browserExecutionStatus:'failed'},evidence:null,objectMatrix:null,browserExecution:{schema:'xtend.rmt.vnext.browser-execution-evidence.v1',workpackage:'RMT-VNEXT-PRIM-06',resultKey:'__xtendRmtVNextSourceToSeaResult',driver:'chromium',required:true,ok:false,status:'failed',mode:'missing-artifact-fallback',reason:'Nightly source-to-sea browser evidence did not create an artifact before exiting.',checks:[{name:'source-to-sea evidence artifact was created by capture step',ok:false,detail:path}]},checks:[{name:'source-to-sea evidence artifact was created by capture step',ok:false,detail:path}]}; fs.writeFileSync(path, JSON.stringify(report,null,2)+'\n');"
          fi

      - name: Upload RMT vNext source-to-sea evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-nightly-source-to-sea-evidence-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json
            .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode
          if-no-files-found: error
          retention-days: 14

      - name: Validate RMT vNext source-to-sea evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm run test:rmt-vnext-source-to-sea:validate-artifact

  optional-conditional-network:
    name: Optional conditional network evidence (Node ${{ matrix.node_version }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_conditional_network == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: '24.18.0'
            runtime_lane: node-24-lts
            artifact_suffix: node-24-18-0
          - node_version: '26.5.0'
            runtime_lane: node-26-current
            artifact_suffix: node-26-5-0

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false

      - name: Pin npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.17.0 --no-audit --fund=false

      - name: Capture and validate Node runtime evidence
        run: node scripts/capture_node_runtime_evidence.js --lane ${{ matrix.runtime_lane }}

      - name: Enable Node warning and deprecation policy
        run: node scripts/enable_node_warning_policy.js --lane ${{ matrix.runtime_lane }}

      - name: Print runtime versions
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: |
          node --version
          npm --version

      - name: Install workspace links for npm SBOM
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Capture conditional network evidence
        env:
          NODE_OPTIONS: --trace-warnings --trace-deprecation --require=${{ github.workspace }}/scripts/node_warning_policy.cjs
          XTEND_CONDITIONAL_NETWORK_EXECUTE: "1"
        run: npm run conditional-network:evidence

      - name: Upload conditional network evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xtend-nightly-conditional-network-evidence-${{ matrix.artifact_suffix }}
          path: |
            .xtend-test-results/runtime/xtend-node-runtime-${{ matrix.runtime_lane }}.json
            .xtend-test-results/runtime/xtend-node-warnings-${{ matrix.runtime_lane }}.jsonl
            .xtend-test-results/xtend-npm-audit-report.json
            .xtend-test-results/xtend-npm-sbom.json
            .xtend-test-results/xtend-conditional-network-evidence-report.json
          if-no-files-found: warn
          retention-days: 14
