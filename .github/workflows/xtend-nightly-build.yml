name: XTend Nightly Build

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      run_source_to_sea:
        description: 'Run optional RMT vNext Source-to-Sea browser evidence.'
        required: false
        default: false
        type: boolean
      run_conditional_network:
        description: 'Run optional audit/SBOM conditional network evidence.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xtend-nightly-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-build:
    name: Nightly build artifact bundle (Node 26.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_CACHE: .xtend-test-results/npm-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Prepare nightly result directories
        run: mkdir -p .xtend-test-results/nightly

      - name: Run XTend full release gate report
        id: full_release
        continue-on-error: true
        run: npm run test:release:full:report

      - name: Run RMT vNext primitive gate report
        id: rmt_primitives
        continue-on-error: true
        run: npm run test:rmt-vnext-primitives:report

      - name: Capture release report evidence
        id: release_report
        continue-on-error: true
        run: npm run release:report

      - name: Validate root package dry run
        id: pack_root
        continue-on-error: true
        run: npm run pack:dry-run

      - name: Validate workspace package dry runs
        id: pack_workspaces
        continue-on-error: true
        run: |
          npm pack --workspace xtendrmt --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xtendrmt.json
          npm pack --workspace fabric --dry-run --json > .xtend-test-results/xtend-pack-dry-run-fabric.json
          npm pack --workspace tools --dry-run --json > .xtend-test-results/xtend-pack-dry-run-tools.json
          npm pack --workspace xtend-builder --dry-run --json > .xtend-test-results/xtend-pack-dry-run-xtend-builder.json

      - name: Create XTend nightly manifest
        if: always()
        run: npm run nightly:manifest

      - name: Upload XTend nightly artifact bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-nightly-build-node-26
          path: |
            .xtend-test-results/xtend-release-gate-report.json
            .xtend-test-results/xtend-rmt-vnext-primitives-gate-report.json
            .xtend-test-results/xtend-release-report.json
            .xtend-test-results/xtend-pack-dry-run.json
            .xtend-test-results/xtend-package-export-surface-lock.json
            .xtend-test-results/xtend-package-export-lock-report.json
            .xtend-test-results/xtend-pack-dry-run-xtendrmt.json
            .xtend-test-results/xtend-pack-dry-run-fabric.json
            .xtend-test-results/xtend-pack-dry-run-tools.json
            .xtend-test-results/xtend-pack-dry-run-xtend-builder.json
            .xtend-test-results/xtend-nightly-build-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail nightly build on required evidence failures
        if: always()
        run: |
          failed=0
          if [ "${{ steps.full_release.outcome }}" != "success" ]; then echo "full release gate failed"; failed=1; fi
          if [ "${{ steps.rmt_primitives.outcome }}" != "success" ]; then echo "RMT vNext primitive gate failed"; failed=1; fi
          if [ "${{ steps.release_report.outcome }}" != "success" ]; then echo "release report failed"; failed=1; fi
          if [ "${{ steps.pack_root.outcome }}" != "success" ]; then echo "root package dry run failed"; failed=1; fi
          if [ "${{ steps.pack_workspaces.outcome }}" != "success" ]; then echo "workspace package dry runs failed"; failed=1; fi
          exit "$failed"

  optional-source-to-sea:
    name: Optional Source-to-Sea browser evidence (Node 26.x)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_source_to_sea == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Capture RMT vNext source-to-sea browser evidence
        run: |
          mkdir -p .xtend-test-results
          set +e
          npm run test:rmt-vnext-source-to-sea:chromedriver
          status=$?
          printf "%s\n" "$status" > .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode
          exit 0
        env:
          RMT_VNEXT_SOURCE_TO_SEA_BROWSER_NAME: chrome
          RMT_VNEXT_SOURCE_TO_SEA_WEBDRIVER_PORT: "9515"

      - name: Ensure RMT vNext source-to-sea evidence artifact
        if: always()
        run: |
          mkdir -p .xtend-test-results
          if [ ! -f .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json ]; then
            node -e "const fs=require('fs'); const path='.xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json'; const report={schema:'xtend.rmt.vnext.source-to-sea-evidence-report.v1',workpackage:'RMT-VNEXT-PRIM-06',ok:false,status:'failed',source:null,browserFixture:null,resultKey:'__xtendRmtVNextSourceToSeaResult',artifact:{path, browserExecutionRequired:true,browserExecutionStatus:'failed'},evidence:null,objectMatrix:null,browserExecution:{schema:'xtend.rmt.vnext.browser-execution-evidence.v1',workpackage:'RMT-VNEXT-PRIM-06',resultKey:'__xtendRmtVNextSourceToSeaResult',driver:'chromedriver',required:true,ok:false,status:'failed',mode:'missing-artifact-fallback',reason:'Nightly source-to-sea browser evidence did not create an artifact before exiting.',checks:[{name:'source-to-sea evidence artifact was created by capture step',ok:false,detail:path}]},checks:[{name:'source-to-sea evidence artifact was created by capture step',ok:false,detail:path}]}; fs.writeFileSync(path, JSON.stringify(report,null,2)+'\n');"
          fi

      - name: Upload RMT vNext source-to-sea evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-nightly-source-to-sea-evidence-node-26
          path: |
            .xtend-test-results/xtend-rmt-vnext-source-to-sea-evidence.json
            .xtend-test-results/xtend-rmt-vnext-source-to-sea-capture.exitcode
          if-no-files-found: error
          retention-days: 14

      - name: Validate RMT vNext source-to-sea evidence
        run: npm run test:rmt-vnext-source-to-sea:validate-artifact

  optional-conditional-network:
    name: Optional conditional network evidence (Node 26.x)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_conditional_network == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install workspace links for npm SBOM
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Capture conditional network evidence
        env:
          XTEND_CONDITIONAL_NETWORK_EXECUTE: "1"
          XTEND_CONDITIONAL_NETWORK_USE_NPX_NPM10: "1"
        run: npm run conditional-network:evidence

      - name: Upload conditional network evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xtend-nightly-conditional-network-evidence-node-26
          path: |
            .xtend-test-results/xtend-npm-audit-report.json
            .xtend-test-results/xtend-npm-sbom.json
            .xtend-test-results/xtend-conditional-network-evidence-report.json
          if-no-files-found: warn
          retention-days: 14
